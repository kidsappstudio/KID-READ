<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>親子學習週曆</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f7;
      --text: #202735;
      --muted: #697386;
      --line: #d9e1ec;
      --primary: #4f7cff;
      --primary-2: #e6edff;
      --good: #1f9d68;
      --good-bg: #e3f7ed;
      --warn: #b7791f;
      --danger: #d64545;
      --shadow: 0 12px 28px rgba(31, 41, 55, .12);
      --radius: 16px;
      --radius-sm: 12px;
      --tap: 48px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --surface: #1f2937;
      --surface-2: #2d3748;
      --text: #f7fafc;
      --muted: #a8b3c7;
      --line: #3b4658;
      --primary: #7aa2ff;
      --primary-2: #22345f;
      --good: #4ade80;
      --good-bg: #163828;
      --warn: #f6c85f;
      --danger: #ff7777;
      --shadow: 0 12px 28px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 17px;
      line-height: 1.45;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: var(--tap);
      border: 0;
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text);
      background: var(--surface-2);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 38%, transparent);
      outline-offset: 2px;
    }

    input, select, textarea {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      background: var(--surface);
    }

    textarea { min-height: 92px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700; }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    h1 { font-size: clamp(24px, 4vw, 38px); }
    h2 { font-size: 22px; }
    h3 { font-size: 18px; }
    .app { min-height: 100vh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px clamp(16px, 3vw, 32px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: grid; gap: 4px; }
    .brand span { color: var(--muted); font-size: 14px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    
    .primary { background: var(--primary); color: white; }
    .undo-btn { background: #4b5563; color: white; font-weight: bold; }
    .undo-btn:hover { background: #374151; }
    .redo-btn { background: #0d9488; color: white; font-weight: bold; }
    .redo-btn:hover { background: #0f766e; }
    .admin-btn { background: #8b5cf6; color: white; font-weight: bold; }
    .admin-btn:hover { background: #7c3aed; }
    
    .danger { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
    .ghost { background: transparent; border: 1px solid var(--line); }
    .small { min-height: 38px; padding: 7px 10px; font-size: 14px; }
    .icon-btn { width: 48px; padding: 0; display: inline-grid; place-items: center; }
    .container { max-width: 1440px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 32px) 80px; }
    .hidden { display: none !important; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .kid-selector, .segmented { display: flex; gap: 10px; flex-wrap: wrap; }

    .kid-button {
      min-width: 140px;
      min-height: 58px;
      font-size: 20px;
      font-weight: 800;
      background: var(--surface);
      border: 2px solid var(--line);
      box-shadow: 0 6px 14px rgba(31, 41, 55, .06);
    }

    .kid-button.active, .segmented button.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .segmented {
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .segmented button { min-height: 42px; }
    
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }

    .metric {
      padding: 14px;
      display: grid;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .metric strong { font-size: 26px; }
    .metric span { color: var(--muted); font-size: 14px; }

    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(170px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .kanban-column {
      min-width: 170px;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .kanban-column.all-done {
      background: color-mix(in srgb, var(--good-bg) 70%, var(--surface));
      border-color: color-mix(in srgb, var(--good) 45%, var(--line));
    }

    .day-title { display: grid; gap: 4px; margin-bottom: 6px; }
    .day-title strong { font-size: 18px; }
    .day-title span { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }

    .task-card {
      display: grid;
      gap: 6px;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 5px 14px rgba(31, 41, 55, .08);
      white-space: pre-wrap;
      word-break: break-all;
    }

    .task-card.done { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
    .task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .task-title { font-weight: 900; overflow-wrap: anywhere; font-size: 17px; }
    .task-memo { color: var(--text); background: var(--surface-2); padding: 6px 8px; border-radius: 6px; font-size: 14px; overflow-wrap: anywhere; border-left: 3px solid var(--primary); }
    
    .status-pill {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 800;
      font-size: 13px;
      background: var(--surface-2);
    }
    .status-pill.done { color: var(--good); background: color-mix(in srgb, var(--good-bg) 80%, var(--surface)); }

    .admin-layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .admin-stack { display: grid; gap: 16px; }
    .panel { padding: 18px; display: grid; gap: 14px; }
    .panel-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .list { display: grid; gap: 10px; }
    .list-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 84%, var(--surface-2));
    }

    /* 支援自由拉動大小的日曆外容器 - 整合優化行動端 */
    .calendar-container {
      min-height: 480px;
      height: 720px; 
      padding: 8px;
      resize: both; /* 允許自由拖曳右下角縮放 */
      overflow: auto; /* 必要配合屬性 */
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      touch-action: pan-y; /* 優化手機上滑動與拉曳手勢 */
    }
    #calendar, #front-calendar { height: 100%; min-height: 100%; }

    .fc {
      --fc-border-color: var(--line);
      --fc-page-bg-color: var(--surface);
      --fc-neutral-bg-color: var(--surface-2);
      --fc-list-event-hover-bg-color: var(--surface-2);
      color: var(--text);
      font-size: 15px;
    }
    .fc .fc-button-primary { background: var(--primary); border-color: var(--primary); }
    .fc .fc-daygrid-day { cursor: pointer; }
    .fc-event { padding: 2px 4px; border-radius: 4px; margin-bottom: 2px; }
    .fc-event-title { white-space: pre-wrap !important; word-break: break-all !important; font-weight: bold; line-height: 1.3; }

    details.panel-details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    details.panel-details summary.panel-summary {
      cursor: pointer;
      padding: 16px;
      font-weight: 900;
      font-size: 22px;
      background: var(--surface-2);
      list-style: none;
    }
    details.panel-details summary.panel-summary::-webkit-details-marker { display: none; }
    .panel-content { padding: 16px; display: grid; gap: 14px; }

    details.subject-details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    summary.subject-summary { cursor: pointer; padding: 14px 16px; font-weight: 900; background: var(--surface-2); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: pre-wrap; word-break: break-all; }
    th { color: var(--muted); font-size: 13px; }
    td .cell-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, .55);
    }
    .modal {
      width: min(520px, 100%);
      padding: 20px;
      display: grid;
      gap: 14px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 80;
      transform: translateX(-50%);
      padding: 12px 16px;
      border-radius: 999px;
      color: white;
      background: #1f2937;
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    /* 行動裝置介面特調：極致優化手機版月曆格子大小與外觀 */
    @media (max-width: 1080px) {
      .admin-layout { grid-template-columns: 1fr; }
      .kanban-grid { grid-template-columns: repeat(7, minmax(200px, 1fr)); }
    }

    @media (max-width: 760px) {
      body { font-size: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
      .actions { width: 100%; justify-content: flex-start; }
      .kid-button { flex: 1 1 auto; min-width: 120px; min-height: 52px; font-size: 18px; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; }
      .summary-strip { grid-template-columns: 1fr; }
      .kanban-grid { grid-template-columns: 1fr; overflow: visible; }
      .kanban-column { min-width: 0; }
      
      /* 手機板日曆基礎高度自適應調整，格子更易於看清 */
      .calendar-container { 
        height: 520px; 
        min-height: 400px; 
        padding: 4px;
      }
      .fc { font-size: 12px; }
      .fc .fc-toolbar { flex-direction: column; gap: 6px; }
      .fc-event-title { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    const STORAGE_KEY = 'learning-calendar-v3';
    const VERSION = '1.3.0';
    const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const mondayNames = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
    const pad = value => String(value).padStart(2, '0');
    const toISODate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    
    const fromISODate = iso => {
      const [year, month, day] = iso.split('-').map(Number);
      return new Date(year, month - 1, day);
    };
    const todayISO = () => toISODate(new Date());
    
    const startOfWeek = date => {
      const copy = new Date(date);
      const day = copy.getDay();
      const offset = day === 0 ? -6 : 1 - day;
      copy.setDate(copy.getDate() + offset);
      copy.setHours(0, 0, 0, 0);
      return copy;
    };
    
    const weekDates = (base = new Date()) => Array.from({ length: 7 }, (_, index) => {
      const date = startOfWeek(base);
      date.setDate(date.getDate() + index);
      return toISODate(date);
    });

    const escapeHTML = text => String(text ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[char]);

    function createDefaultData() {
      return {
        version: VERSION,
        pin: '1234',
        kids: ['👦 哥哥', '👧 妹妹'],
        subjects: [
          { name: '數學講義', enabled: true },
          { name: '英文套書', enabled: true },
          { name: '國文閱讀', enabled: true }
        ],
        fixedTasks: [],
        tempTasks: [],
        taskInstances: [],
        settings: {
          selectedKid: '👦 哥哥',
          viewMode: 'week', 
          adminMode: 'single',
          adminKid: '👦 哥哥',
          darkMode: false
        }
      };
    }

    const DataModel = {
      normalize(input) {
        const base = createDefaultData();
        const data = { ...base, ...(input || {}) };
        data.version = VERSION;
        data.pin = String(data.pin || '1234');
        data.kids = Array.isArray(data.kids) && data.kids.length ? data.kids.map(String) : base.kids;
        data.subjects = Array.isArray(data.subjects) ? data.subjects.map(subject => ({
          name: String(subject.name || '').trim(),
          enabled: subject.enabled !== false
        })).filter(subject => subject.name) : base.subjects;
        data.fixedTasks = Array.isArray(data.fixedTasks) ? data.fixedTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          dayOfWeek: Number(task.dayOfWeek) || 0,
          memo: String(task.memo || '')
        })).filter(task => task.subject) : [];
        data.tempTasks = Array.isArray(data.tempTasks) ? data.tempTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        data.taskInstances = Array.isArray(data.taskInstances) ? data.taskInstances.map(task => ({
          id: task.id || uid(),
          sourceId: task.sourceId || '',
          type: task.type === 'temp' ? 'temp' : 'fixed',
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        data.settings = { ...base.settings, ...(data.settings || {}) };
        if (!data.kids.includes(data.settings.selectedKid)) data.settings.selectedKid = data.kids[0];
        if (!data.kids.includes(data.settings.adminKid)) data.settings.adminKid = data.kids[0];
        return data;
      }
    };

    const Repository = {
      initialize() {
        const loaded = this.load();
        if (loaded) {
          state.db = DataModel.normalize(loaded);
        } else {
          state.db = createDefaultData();
        }
        this.save(state.db);
        return state.db;
      },
      save(data = state.db) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DataModel.normalize(data)));
      },
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      },
      exportJSON() { return JSON.stringify(DataModel.normalize(state.db), null, 2); },
      importJSON(jsonText) {
        const parsed = JSON.parse(jsonText);
        state.db = DataModel.normalize(parsed);
        this.save(state.db);
        return state.db;
      },
      exportCSV() {
        ensureInstancesForCurrentMonth();
        const rows = [['小孩', '日期', '科目', '備註', '狀態']];
        allHistoryTasks().filter(t => t.done).sort(sortTasksDesc).forEach(task => {
          rows.push([task.kid, task.date, task.subject, task.memo, '已完成']);
        });
        return rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      }
    };

    // 支援 復原(Undo) 與 取消復原/重做(Redo) 的雙重狀態管理
    const state = {
      db: null,
      screen: 'front',
      currentWeek: startOfWeek(new Date()),
      calendar: null,
      frontCalendar: null,
      undoStack: [],
      redoStack: []
    };

    function csvCell(value) {
      const text = String(value ?? '');
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function snapshot() {
      if (state.undoStack.length > 25) state.undoStack.shift();
      state.undoStack.push(JSON.stringify(state.db));
      state.redoStack = []; // 有新改動時，清空取消復原棧
    }

    function triggerUndo() {
      if (!state.undoStack.length) return toast('沒有上一動紀錄可以恢復');
      state.redoStack.push(JSON.stringify(state.db)); // 將目前狀態丟入重做
      const previous = state.undoStack.pop();
      state.db = DataModel.normalize(JSON.parse(previous));
      persist(true, false);
      toast('已成功恢復上一動 ↩');
    }

    function triggerRedo() {
      if (!state.redoStack.length) return toast('沒有可以取消復原的動作');
      state.undoStack.push(JSON.stringify(state.db)); // 將目前狀態丟回復原
      const nextState = state.redoStack.pop();
      state.db = DataModel.normalize(JSON.parse(nextState));
      persist(true, false);
      toast('已取消復原 (重做成功) ↪');
    }

    function persist(render = true, createSnapshot = true) {
      if (createSnapshot) snapshot();
      state.db = DataModel.normalize(state.db);
      Repository.save(state.db);
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      if (render) renderApp();
    }

    function enabledSubjects() {
      const enabled = state.db.subjects.filter(subject => subject.enabled).map(subject => subject.name);
      return enabled.length ? enabled : state.db.subjects.map(subject => subject.name);
    }

    function isSubjectEnabled(name) {
      return state.db.subjects.some(subject => subject.name === name && subject.enabled);
    }

    function sortTasksDesc(a, b) {
      return b.date.localeCompare(a.date) || a.kid.localeCompare(b.kid) || a.subject.localeCompare(b.subject);
    }

    // 核心安全鎖：限制任何固定行程的自動生成「僅在指定的該月份之內」
    function ensureInstancesForRange(startISO, endISO) {
      // 根據傳入的時間判斷當前使用者在看哪個月
      const pivotDate = fromISODate(startISO);
      pivotDate.setDate(pivotDate.getDate() + 10); // 往後移10天穩固落在目標月份內
      
      // 算出該月份的絕對起迄範圍 (嚴格限制本月 1 號到當月最後一天)
      const year = pivotDate.getFullYear();
      const month = pivotDate.getMonth();
      const firstDayOfMonth = new Date(year, month, 1);
      const lastDayOfMonth = new Date(year, month + 1, 0);

      const mStartISO = toISODate(firstDayOfMonth);
      const mEndISO = toISODate(lastDayOfMonth);

      const existing = new Set(state.db.taskInstances.map(task => `${task.sourceId}_${task.date}`));
      state.db.fixedTasks.forEach(fixed => {
        let cursor = new Date(firstDayOfMonth);
        while (cursor <= lastDayOfMonth) {
          if (cursor.getDay() === Number(fixed.dayOfWeek)) {
            const date = toISODate(cursor);
            const key = `${fixed.id}_${date}`;
            if (!existing.has(key)) {
              state.db.taskInstances.push({
                id: uid(),
                sourceId: fixed.id,
                type: 'fixed',
                kid: fixed.kid,
                subject: fixed.subject,
                date,
                memo: fixed.memo,
                done: false
              });
              existing.add(key);
            }
          }
          cursor.setDate(cursor.getDate() + 1);
        }
      });
    }

    function ensureInstancesForCurrentMonth() {
      const today = new Date();
      const firstDay = toISODate(new Date(today.getFullYear(), today.getMonth(), 1));
      const lastDay = toISODate(new Date(today.getFullYear(), today.getMonth() + 1, 0));
      ensureInstancesForRange(firstDay, lastDay);
    }

    function syncTempInstances() {
      const fixedInstances = state.db.taskInstances.filter(task => task.type !== 'temp');
      const tempInstances = state.db.tempTasks.map(task => ({
        id: task.id,
        sourceId: task.id,
        type: 'temp',
        kid: task.kid,
        subject: task.subject,
        date: task.date,
        memo: task.memo,
        done: task.done
      }));
      state.db.taskInstances = [...fixedInstances, ...tempInstances];
    }

    function allHistoryTasks() {
      syncTempInstances();
      return state.db.taskInstances;
    }

    function tasksForWeek(kid) {
      const dates = weekDates(state.currentWeek);
      ensureInstancesForRange(dates[0], dates[6]);
      syncTempInstances();
      Repository.save(state.db);
      return dates.map(date => ({
        date,
        tasks: state.db.taskInstances
          .filter(task => task.kid === kid && task.date === date && isSubjectEnabled(task.subject))
          .sort((a, b) => a.type.localeCompare(b.type) || a.subject.localeCompare(b.subject))
      }));
    }

    function dateIsAllDone(tasks) {
      return tasks.length > 0 && tasks.every(task => task.done);
    }

    function addKid(name) {
      const clean = name.trim();
      if (!clean || state.db.kids.includes(clean)) return toast('人物名稱重複或空白');
      snapshot();
      state.db.kids.push(clean);
      state.db.settings.adminKid = clean;
      state.db.settings.selectedKid = clean;
      persist(true, false);
    }

    function deleteKid(name) {
      if (state.db.kids.length <= 1) return toast('至少需要保留一位成員');
      if (!confirm(`確定要刪除「${name}」？`)) return;
      snapshot();
      state.db.kids = state.db.kids.filter(k => k !== name);
      if (!state.db.kids.includes(state.db.settings.selectedKid)) state.db.settings.selectedKid = state.db.kids[0];
      if (!state.db.kids.includes(state.db.settings.adminKid)) state.db.settings.adminKid = state.db.kids[0];
      persist(true, false);
      toast('成員已刪除');
    }

    function addSubject(name) {
      const clean = name.trim();
      if (!clean || state.db.subjects.some(subject => subject.name === clean)) return toast('科目名稱重複或空白');
      snapshot();
      state.db.subjects.push({ name: clean, enabled: true });
      persist(true, false);
    }

    function deleteSubject(name) {
      if (!confirm(`確定刪除科目「${name}」？`)) return;
      snapshot();
      state.db.subjects = state.db.subjects.filter(s => s.name !== name);
      persist(true, false);
      toast('科目已刪除');
    }

    function addFixedTask(form) {
      const subject = form.subject.value;
      if (!subject) return toast('請先建立科目');
      
      snapshot();
      const newFixed = {
        id: uid(),
        kid: state.db.settings.adminKid,
        subject,
        dayOfWeek: Number(form.dayOfWeek.value),
        memo: form.memo.value.trim()
      };
      state.db.fixedTasks.push(newFixed);

      // 現抓現派：限定僅填補本月剩餘或該月排程
      const today = new Date();
      ensureInstancesForRange(toISODate(today), toISODate(today));

      form.reset();
      persist(true, false);
      toast('已新增固定行程（生成限制：僅限本月份內）');
    }

    function addTempTask({ kid, subject, date, memo }) {
      if (!subject || !date) return toast('請選擇日期與科目');
      snapshot();
      state.db.tempTasks.push({ id: uid(), kid, subject, date, memo: memo.trim(), done: false });
      syncTempInstances();
      persist(true, false);
      toast('已新增行程');
    }

    function updateTask(taskId, updates) {
      snapshot();
      const temp = state.db.tempTasks.find(task => task.id === taskId);
      if (temp) Object.assign(temp, updates);
      const instance = state.db.taskInstances.find(task => task.id === taskId);
      if (instance) Object.assign(instance, updates);
      persist(true, false);
    }

    function deleteTask(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId) || state.db.tempTasks.find(item => item.id === taskId);
      if (!task || !confirm('確定刪除這筆任務？')) return;
      snapshot();
      state.db.tempTasks = state.db.tempTasks.filter(item => item.id !== taskId);
      state.db.taskInstances = state.db.taskInstances.filter(item => item.id !== taskId);
      persist(true, false);
    }

    function toggleDone(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId);
      if (!task) return;
      snapshot();
      task.done = !task.done; 
      const temp = state.db.tempTasks.find(item => item.id === taskId);
      if (temp) temp.done = task.done;
      persist(true, false);
    }

    function deleteFixedTaskRule(ruleId) {
      if (!confirm('確定刪除固定行程規則？目前產生的相關排程將一併刪除。')) return;
      snapshot();
      state.db.fixedTasks = state.db.fixedTasks.filter(item => item.id !== ruleId);
      state.db.taskInstances = state.db.taskInstances.filter(item => !(item.sourceId === ruleId && !item.done));
      persist(true, false);
      toast('固定行程規則已刪除');
    }

    function resetThisWeek() {
      if (!confirm('確定清除本週完成狀態？')) return;
      snapshot();
      const dates = new Set(weekDates(state.currentWeek));
      state.db.taskInstances.forEach(task => {
        if (dates.has(task.date)) task.done = false;
      });
      state.db.tempTasks.forEach(task => {
        if (dates.has(task.date)) task.done = false;
      });
      persist(true, false);
      toast('本週已重置');
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function toast(message) {
      document.querySelector('.toast')?.remove();
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2200);
    }

    function renderCalendar() {
      // 1. 後台大月曆
      if (state.screen === 'admin') {
        const el = document.getElementById('calendar');
        if (!el || !window.FullCalendar) return;
        if (state.calendar) state.calendar.destroy();
        const kids = state.db.settings.adminMode === 'multi' ? state.db.kids : [state.db.settings.adminKid];
        
        const getEvents = () => allHistoryTasks().filter(task => kids.includes(task.kid) && isSubjectEnabled(task.subject)).map(task => ({
          id: task.id,
          title: `${task.kid}: ${task.subject}${task.memo ? ' ('+task.memo+')' : ''}${task.done ? ' ✓' : ''}`,
          start: task.date,
          backgroundColor: task.done ? '#1f9d68' : '#4f7cff',
          borderColor: 'transparent'
        }));

        state.calendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth',
          locale: 'zh-tw',
          height: '100%',
          firstDay: 1,
          fixedWeekCount: false, // 關閉固定6週：依據本月天數動態調整週數，更精簡！
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listWeek' },
          events: getEvents(),
          dateClick: info => openTaskModal(info.dateStr),
          eventClick: info => {
            const task = state.db.taskInstances.find(item => item.id === info.event.id);
            if (task) openTaskModal(task.date, task);
          },
          datesSet: info => {
            const end = new Date(info.end);
            end.setDate(end.getDate() - 1);
            ensureInstancesForRange(info.startStr.slice(0, 10), toISODate(end));
            syncTempInstances();
            Repository.save(state.db);
            if (state.calendar) {
              state.calendar.removeAllEvents();
              state.calendar.addEventSource(getEvents());
            }
          }
        });
        state.calendar.render();
      }

      // 2. 前台動態月曆模式
      if (state.screen === 'front' && state.db.settings.viewMode === 'month') {
        const el = document.getElementById('front-calendar');
        if (!el || !window.FullCalendar) return;
        if (state.frontCalendar) state.frontCalendar.destroy();
        const currentKid = state.db.settings.selectedKid;

        const getFrontEvents = () => allHistoryTasks().filter(task => task.kid === currentKid && isSubjectEnabled(task.subject)).map(task => ({
          id: task.id,
          title: `${task.subject}${task.memo ? '\n📝 '+task.memo : ''}${task.done ? ' (✅完成)' : ''}`,
          start: task.date,
          backgroundColor: task.done ? '#1f9d68' : '#e2e8f0',
          textColor: task.done ? '#ffffff' : '#1e293b',
          borderColor: task.done ? 'transparent' : '#cbd5e1'
        }));

        state.frontCalendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth',
          locale: 'zh-tw',
          height: '100%',
          firstDay: 1,
          fixedWeekCount: false, // 只顯示本月份對應的實體週數範圍
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth' },
          events: getFrontEvents(),
          eventClick: info => {
            toggleDone(info.event.id);
          },
          datesSet: info => {
            const end = new Date(info.end);
            end.setDate(end.getDate() - 1);
            ensureInstancesForRange(info.startStr.slice(0, 10), toISODate(end));
            syncTempInstances();
            Repository.save(state.db);
            if (state.frontCalendar) {
              state.frontCalendar.removeAllEvents();
              state.frontCalendar.addEventSource(getFrontEvents());
            }
          }
        });
        state.frontCalendar.render();
      }
    }

    function renderApp() {
      const app = document.getElementById('app');
      app.innerHTML = state.screen === 'admin' ? AdminPanel() : FrontPage();
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      requestAnimationFrame(renderCalendar);
    }

    function openTaskModal(date, task = null) {
      document.body.insertAdjacentHTML('beforeend', TaskModal(date, task));
    }

    function handleAction(target, event) {
      const action = target.dataset.action;
      if (!action) return;
      if (action === 'undoAction') triggerUndo();
      if (action === 'redoAction') triggerRedo();
      if (action === 'selectKid') {
        state.db.settings.selectedKid = target.dataset.kid;
        persist(true, false);
      }
      if (action === 'setViewMode') {
        state.db.settings.viewMode = target.dataset.mode;
        persist(true, false);
      }
      if (action === 'toggleDone') toggleDone(target.dataset.taskId);
      if (action === 'openAdmin') {
        const pin = prompt('請輸入家長PIN碼');
        if (pin === state.db.pin) {
          state.screen = 'admin';
          renderApp();
        } else if (pin !== null) toast('PIN 錯誤');
      }
      if (action === 'goFront') {
        state.screen = 'front';
        renderApp();
      }
      if (action === 'toggleTheme') {
        state.db.settings.darkMode = !state.db.settings.darkMode;
        persist(true, false);
      }
      if (action === 'setAdminMode') {
        state.db.settings.adminMode = target.dataset.mode;
        persist();
      }
      if (action === 'selectAdminKid') {
        state.db.settings.adminKid = target.dataset.kid;
        persist(true, false);
      }
      if (action === 'deleteKid') {
        deleteKid(target.dataset.kid);
      }
      if (action === 'setSubject') {
        snapshot();
        const subject = state.db.subjects.find(item => item.name === target.dataset.subject);
        if (subject) subject.enabled = target.dataset.enabled === 'true';
        persist(true, false);
      }
      if (action === 'deleteSubject') {
        deleteSubject(target.dataset.subject);
      }
      if (action === 'resetWeek') resetThisWeek();
      if (action === 'deleteFixed') {
        deleteFixedTaskRule(target.dataset.id);
      }
      if (action === 'editTask') {
        const task = state.db.taskInstances.find(item => item.id === target.dataset.taskId);
        if (task) openTaskModal(task.date, task);
      }
      if (action === 'deleteTask') deleteTask(target.dataset.taskId);
      if (action === 'closeModal') target.closest('[data-modal]')?.remove();
      if (action === 'exportJSON') downloadFile('learning-calendar-backup.json', Repository.exportJSON(), 'application/json;charset=utf-8');
      if (action === 'exportCSV') downloadFile('learning-history.csv', Repository.exportCSV(), 'text/csv;charset=utf-8');
      if (action === 'importJSON' && event.type === 'change') importJSONFile(target.files[0]);
    }

    function handleSubmit(form, event) {
      event.preventDefault();
      const type = form.dataset.form;
      if (type === 'addKid') addKid(form.kid.value);
      if (type === 'addSubject') addSubject(form.subject.value);
      if (type === 'changePin') {
        snapshot();
        state.db.pin = form.pin.value.trim();
        form.reset();
        persist(true, false);
        toast('PIN 已更新');
      }
      if (type === 'addFixed') addFixedTask(form);
      if (type === 'addTemp') {
        addTempTask({
          kid: form.kid.value,
          subject: form.subject.value,
          date: form.date.value,
          memo: form.memo.value
        });
        form.closest('[data-modal]')?.remove();
      }
      if (type === 'saveTaskEdit') {
        updateTask(form.taskId.value, {
          kid: form.kid.value,
          subject: form.subject.value,
          memo: form.memo.value.trim()
        });
        form.closest('[data-modal]')?.remove();
        toast('任務已更新');
      }
    }

    function importJSONFile(file) {
      if (!file) return;
      if (!confirm('此操作不可復原，確定要完全覆蓋目前資料？')) return;
      snapshot();
      const reader = new FileReader();
      reader.onload = () => {
        try {
          Repository.importJSON(reader.result);
          state.screen = 'front';
          renderApp();
          toast('JSON 已匯入');
        } catch { toast('JSON 格式不正確'); }
      };
      reader.readAsText(file);
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (target) handleAction(target, event);
    });
    document.addEventListener('change', event => {
      const target = event.target.closest('[data-action]');
      if (target) handleAction(target, event);
    });
    document.addEventListener('submit', event => {
      const form = event.target.closest('form[data-form]');
      if (form) handleSubmit(form, event);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelector('[data-modal]')?.remove();
    });

    Repository.initialize();
    renderApp();
  </script>
</body>
</html>
