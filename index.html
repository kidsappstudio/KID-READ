<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>親子學習週曆</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f7;
      --text: #202735;
      --muted: #697386;
      --line: #d9e1ec;
      --primary: #4f7cff;
      --primary-2: #e6edff;
      --good: #1f9d68;
      --good-bg: #e3f7ed;
      --warn: #b7791f;
      --danger: #d64545;
      --shadow: 0 12px 28px rgba(31, 41, 55, .12);
      --radius: 16px;
      --radius-sm: 12px;
      --tap: 48px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --surface: #1f2937;
      --surface-2: #2d3748;
      --text: #f7fafc;
      --muted: #a8b3c7;
      --line: #3b4658;
      --primary: #7aa2ff;
      --primary-2: #22345f;
      --good: #4ade80;
      --good-bg: #163828;
      --warn: #f6c85f;
      --danger: #ff7777;
      --shadow: 0 12px 28px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 17px;
      line-height: 1.45;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      min-height: var(--tap);
      border: 0;
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: var(--text);
      background: var(--surface-2);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 38%, transparent);
      outline-offset: 2px;
    }

    input, select, textarea {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      background: var(--surface);
    }

    textarea { min-height: 92px; resize: vertical; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700; }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    h1 { font-size: clamp(28px, 4vw, 44px); }
    h2 { font-size: 24px; }
    h3 { font-size: 19px; }
    .app { min-height: 100vh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px clamp(16px, 3vw, 32px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: grid; gap: 4px; }
    .brand span { color: var(--muted); font-size: 14px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .primary { background: var(--primary); color: white; }
    .danger { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
    .ghost { background: transparent; border: 1px solid var(--line); }
    .small { min-height: 38px; padding: 7px 10px; font-size: 14px; }
    .icon-btn { width: 48px; padding: 0; display: inline-grid; place-items: center; }
    .container { max-width: 1440px; margin: 0 auto; padding: 22px clamp(14px, 3vw, 32px) 80px; }
    .hidden { display: none !important; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .kid-selector, .segmented {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .kid-button {
      min-width: 150px;
      min-height: 64px;
      font-size: 22px;
      font-weight: 800;
      background: var(--surface);
      border: 2px solid var(--line);
      box-shadow: 0 8px 18px rgba(31, 41, 55, .08);
    }

    .kid-button.active, .segmented button.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .segmented {
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .segmented button { min-height: 42px; }
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 18px;
    }

    .metric {
      padding: 16px;
      display: grid;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .metric strong { font-size: 28px; }
    .metric span { color: var(--muted); font-size: 14px; }

    .week-grid, .kanban-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(180px, 1fr));
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .day-card, .kanban-column {
      min-width: 180px;
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .day-card.all-done, .kanban-column.all-done {
      background: color-mix(in srgb, var(--good-bg) 70%, var(--surface));
      border-color: color-mix(in srgb, var(--good) 45%, var(--line));
    }

    .day-title { display: grid; gap: 4px; }
    .day-title strong { font-size: 18px; }
    .day-title span { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }

    .task-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 5px 14px rgba(31, 41, 55, .08);
    }

    .task-card.done { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
    .task-card.locked { opacity: .92; }
    .task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .task-title { font-weight: 900; overflow-wrap: anywhere; }
    .task-type { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .task-memo { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .status-pill {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 800;
      font-size: 14px;
      background: var(--surface-2);
    }
    .status-pill.done { color: var(--good); background: color-mix(in srgb, var(--good-bg) 80%, var(--surface)); }
    .status-pill.locked { color: var(--warn); }

    .admin-layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .admin-stack { display: grid; gap: 16px; }
    .panel { padding: 18px; display: grid; gap: 14px; }
    .panel-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .form-grid.one { grid-template-columns: 1fr; }
    .inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
    .list { display: grid; gap: 10px; }
    .list-row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 84%, var(--surface-2));
    }
    .list-row strong { overflow-wrap: anywhere; }
    .switch-row { display: flex; gap: 8px; flex-wrap: wrap; }

    #calendar {
      min-height: 620px;
      padding: 10px;
    }

    .fc {
      --fc-border-color: var(--line);
      --fc-page-bg-color: var(--surface);
      --fc-neutral-bg-color: var(--surface-2);
      --fc-list-event-hover-bg-color: var(--surface-2);
      color: var(--text);
    }
    .fc .fc-button-primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .fc .fc-daygrid-day { cursor: pointer; }

    details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    summary {
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 900;
      background: var(--surface-2);
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 820px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 13px; }
    td .cell-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, .55);
    }
    .modal {
      width: min(520px, 100%);
      padding: 20px;
      display: grid;
      gap: 14px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .admin-lock {
      position: fixed;
      right: 10px;
      bottom: 10px;
      z-index: 20;
      width: 34px;
      min-height: 34px;
      padding: 0;
      font-size: 15px;
      opacity: .45;
      border-radius: 999px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 80;
      transform: translateX(-50%);
      padding: 12px 16px;
      border-radius: 999px;
      color: white;
      background: #1f2937;
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    @media (max-width: 1080px) {
      .admin-layout { grid-template-columns: 1fr; }
      .week-grid, .kanban-grid { grid-template-columns: repeat(7, minmax(220px, 1fr)); }
    }

    @media (max-width: 760px) {
      body { font-size: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      .kid-button { flex: 1 1 100%; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; }
      .summary-strip { grid-template-columns: 1fr; }
      .form-grid, .inline-form { grid-template-columns: 1fr; }
      .week-grid, .kanban-grid {
        grid-template-columns: 1fr;
        overflow: visible;
      }
      .day-card, .kanban-column { min-width: 0; }
      #calendar { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    const STORAGE_KEY = 'learning-calendar-v1';
    const VERSION = '1.0.0';
    const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const weekLabels = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];
    const mondayNames = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
    const pad = value => String(value).padStart(2, '0');
    const toISODate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const fromISODate = iso => {
      const [year, month, day] = iso.split('-').map(Number);
      return new Date(year, month - 1, day);
    };
    const todayISO = () => toISODate(new Date());
    const startOfWeek = date => {
      const copy = new Date(date);
      const day = copy.getDay();
      const offset = day === 0 ? -6 : 1 - day;
      copy.setDate(copy.getDate() + offset);
      copy.setHours(0, 0, 0, 0);
      return copy;
    };
    const weekDates = (base = new Date()) => Array.from({ length: 7 }, (_, index) => {
      const date = startOfWeek(base);
      date.setDate(date.getDate() + index);
      return toISODate(date);
    });
    const escapeHTML = text => String(text ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[char]);

    function createDefaultData() {
      return {
        version: VERSION,
        pin: '1234',
        kids: ['👦 哥哥', '👧 妹妹'],
        subjects: [
          { name: '數學講義', enabled: true },
          { name: '英文套書', enabled: true },
          { name: '國文閱讀', enabled: true }
        ],
        fixedTasks: [],
        tempTasks: [],
        taskInstances: [],
        verifiedTasks: {},
        settings: {
          selectedKid: '👦 哥哥',
          viewMode: 'week',
          adminMode: 'single',
          adminKid: '👦 哥哥',
          darkMode: false
        }
      };
    }

    const DataModel = {
      normalize(input) {
        const base = createDefaultData();
        const data = { ...base, ...(input || {}) };
        data.version = VERSION;
        data.pin = String(data.pin || '1234');
        data.kids = Array.isArray(data.kids) && data.kids.length ? data.kids.map(String) : base.kids;
        data.subjects = Array.isArray(data.subjects) ? data.subjects.map(subject => ({
          name: String(subject.name || '').trim(),
          enabled: subject.enabled !== false
        })).filter(subject => subject.name) : base.subjects;
        data.fixedTasks = Array.isArray(data.fixedTasks) ? data.fixedTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          dayOfWeek: Number(task.dayOfWeek) || 0,
          memo: String(task.memo || '')
        })).filter(task => task.subject) : [];
        data.tempTasks = Array.isArray(data.tempTasks) ? data.tempTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        data.taskInstances = Array.isArray(data.taskInstances) ? data.taskInstances.map(task => ({
          id: task.id || uid(),
          sourceId: task.sourceId || '',
          type: task.type === 'temp' ? 'temp' : 'fixed',
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        data.verifiedTasks = data.verifiedTasks && typeof data.verifiedTasks === 'object' ? data.verifiedTasks : {};
        data.settings = { ...base.settings, ...(data.settings || {}) };
        if (!data.kids.includes(data.settings.selectedKid)) data.settings.selectedKid = data.kids[0];
        if (!data.kids.includes(data.settings.adminKid)) data.settings.adminKid = data.kids[0];
        return data;
      }
    };

    const Repository = {
      initialize() {
        const loaded = this.load();
        if (loaded) {
          state.db = DataModel.normalize(loaded);
        } else {
          state.db = createDefaultData();
        }
        this.save(state.db);
        return state.db;
      },
      save(data = state.db) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DataModel.normalize(data)));
      },
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      },
      exportJSON() {
        return JSON.stringify(DataModel.normalize(state.db), null, 2);
      },
      importJSON(jsonText) {
        const parsed = JSON.parse(jsonText);
        state.db = DataModel.normalize(parsed);
        this.save(state.db);
        return state.db;
      },
      exportCSV() {
        ensureInstancesForCurrentYear();
        const rows = [['小孩', '日期', '科目', '類型', '備註', '完成', '審核']];
        allHistoryTasks().sort(sortTasks).forEach(task => {
          rows.push([
            task.kid,
            task.date,
            task.subject,
            task.type === 'fixed' ? '固定' : '臨時',
            task.memo,
            task.done ? '已勾' : '未勾',
            isVerified(task) ? '已審核' : '未審核'
          ]);
        });
        this.save(state.db);
        return rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      }
    };

    const state = {
      db: null,
      screen: 'front',
      currentWeek: startOfWeek(new Date()),
      calendar: null
    };

    function csvCell(value) {
      const text = String(value ?? '');
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function persist(render = true) {
      state.db = DataModel.normalize(state.db);
      Repository.save(state.db);
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      if (render) renderApp();
    }

    function enabledSubjects() {
      const enabled = state.db.subjects.filter(subject => subject.enabled).map(subject => subject.name);
      return enabled.length ? enabled : state.db.subjects.map(subject => subject.name);
    }

    function verificationKey(task) {
      return `${task.kid}_${task.id}_${task.date}`;
    }

    function isVerified(task) {
      return Boolean(state.db.verifiedTasks[verificationKey(task)]);
    }

    function isSubjectEnabled(name) {
      return state.db.subjects.some(subject => subject.name === name && subject.enabled);
    }

    function sortTasks(a, b) {
      return a.date.localeCompare(b.date) || a.kid.localeCompare(b.kid) || a.subject.localeCompare(b.subject);
    }

    function ensureInstancesForRange(startISO, endISO) {
      const start = fromISODate(startISO);
      const end = fromISODate(endISO);
      const existing = new Set(state.db.taskInstances.map(task => `${task.sourceId}_${task.date}`));
      state.db.fixedTasks.forEach(fixed => {
        for (let cursor = new Date(start); cursor <= end; cursor.setDate(cursor.getDate() + 1)) {
          if (cursor.getDay() !== Number(fixed.dayOfWeek)) continue;
          const date = toISODate(cursor);
          const key = `${fixed.id}_${date}`;
          if (!existing.has(key)) {
            state.db.taskInstances.push({
              id: uid(),
              sourceId: fixed.id,
              type: 'fixed',
              kid: fixed.kid,
              subject: fixed.subject,
              date,
              memo: fixed.memo,
              done: false
            });
            existing.add(key);
          }
        }
      });
    }

    function ensureInstancesForCurrentYear() {
      const year = new Date().getFullYear();
      ensureInstancesForRange(`${year}-01-01`, `${year}-12-31`);
    }

    function syncTempInstances() {
      const fixedInstances = state.db.taskInstances.filter(task => task.type !== 'temp');
      const tempInstances = state.db.tempTasks.map(task => ({
        id: task.id,
        sourceId: task.id,
        type: 'temp',
        kid: task.kid,
        subject: task.subject,
        date: task.date,
        memo: task.memo,
        done: task.done
      }));
      state.db.taskInstances = [...fixedInstances, ...tempInstances];
    }

    function allHistoryTasks() {
      syncTempInstances();
      return state.db.taskInstances;
    }

    function tasksForWeek(kid) {
      const dates = weekDates(state.currentWeek);
      ensureInstancesForRange(dates[0], dates[6]);
      syncTempInstances();
      Repository.save(state.db);
      return dates.map(date => ({
        date,
        tasks: state.db.taskInstances
          .filter(task => task.kid === kid && task.date === date && isSubjectEnabled(task.subject))
          .sort((a, b) => a.type.localeCompare(b.type) || a.subject.localeCompare(b.subject))
      }));
    }

    function dateIsAllDone(tasks) {
      return tasks.length > 0 && tasks.every(task => task.done);
    }

    function addKid(name) {
      const clean = name.trim();
      if (!clean || state.db.kids.includes(clean)) return toast('人物名稱重複或空白');
      state.db.kids.push(clean);
      state.db.settings.adminKid = clean;
      state.db.settings.selectedKid = clean;
      persist();
    }

    function addSubject(name) {
      const clean = name.trim();
      if (!clean || state.db.subjects.some(subject => subject.name === clean)) return toast('科目名稱重複或空白');
      state.db.subjects.push({ name: clean, enabled: true });
      persist();
    }

    function addFixedTask(form) {
      const subject = form.subject.value;
      if (!subject) return toast('請先建立科目');
      state.db.fixedTasks.push({
        id: uid(),
        kid: state.db.settings.adminKid,
        subject,
        dayOfWeek: Number(form.dayOfWeek.value),
        memo: form.memo.value.trim()
      });
      form.reset();
      persist();
    }

    function addTempTask({ kid, subject, date, memo }) {
      if (!subject || !date) return toast('請選擇日期與科目');
      state.db.tempTasks.push({ id: uid(), kid, subject, date, memo: memo.trim(), done: false });
      syncTempInstances();
      persist();
      toast('已新增臨時任務');
    }

    function updateTask(taskId, updates) {
      const temp = state.db.tempTasks.find(task => task.id === taskId);
      if (temp) Object.assign(temp, updates);
      const instance = state.db.taskInstances.find(task => task.id === taskId);
      if (instance) Object.assign(instance, updates);
      persist();
    }

    function deleteTask(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId) || state.db.tempTasks.find(item => item.id === taskId);
      if (!task || !confirm('確定刪除這筆任務？')) return;
      delete state.db.verifiedTasks[verificationKey(task)];
      state.db.tempTasks = state.db.tempTasks.filter(item => item.id !== taskId);
      state.db.taskInstances = state.db.taskInstances.filter(item => item.id !== taskId);
      persist();
    }

    function toggleDone(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId);
      if (!task || isVerified(task)) return;
      task.done = !task.done;
      const temp = state.db.tempTasks.find(item => item.id === taskId);
      if (temp) temp.done = task.done;
      persist();
    }

    function verifyTask(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId);
      if (!task || !task.done) return;
      state.db.verifiedTasks[verificationKey(task)] = true;
      persist();
    }

    function resetThisWeek() {
      if (!confirm('確定清除本週完成與審核狀態？任務與歷史會保留。')) return;
      const dates = new Set(weekDates(state.currentWeek));
      state.db.taskInstances.forEach(task => {
        if (dates.has(task.date)) task.done = false;
      });
      state.db.tempTasks.forEach(task => {
        if (dates.has(task.date)) task.done = false;
      });
      Object.keys(state.db.verifiedTasks).forEach(key => {
        const task = state.db.taskInstances.find(item => verificationKey(item) === key);
        if (task && dates.has(task.date)) delete state.db.verifiedTasks[key];
      });
      persist();
      toast('本週已重置');
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function toast(message) {
      document.querySelector('.toast')?.remove();
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2200);
    }

    function KidSelector({ selected, onClickName = 'selectKid', compact = false }) {
      return `<div class="kid-selector" data-component="KidSelector">
        ${state.db.kids.map(kid => `
          <button class="kid-button ${kid === selected ? 'active' : ''} ${compact ? 'small' : ''}" data-action="${onClickName}" data-kid="${escapeHTML(kid)}">${escapeHTML(kid)}</button>
        `).join('')}
      </div>`;
    }

    function TaskCard(task) {
      const locked = isVerified(task);
      const icon = task.type === 'fixed' ? '🔄' : '⭐';
      return `<article class="task-card ${task.done ? 'done' : ''} ${locked ? 'locked' : ''}" data-component="TaskCard">
        <div class="task-head">
          <div>
            <div class="task-title">${icon} ${escapeHTML(task.subject)}</div>
            <div class="task-type">${task.type === 'fixed' ? '固定任務' : '臨時任務'}</div>
          </div>
          <button class="status-pill ${task.done ? 'done' : ''} ${locked ? 'locked' : ''}" data-action="toggleDone" data-task-id="${task.id}" ${locked ? 'disabled' : ''}>
            ${locked ? '🔒 已審核' : task.done ? '完成' : '未完成'}
          </button>
        </div>
        ${task.memo ? `<div class="task-memo">${escapeHTML(task.memo)}</div>` : ''}
      </article>`;
    }

    function WeekGrid(days) {
      return `<section class="week-grid" data-component="WeekGrid">
        ${days.map((day, index) => `
          <div class="day-card card ${dateIsAllDone(day.tasks) ? 'all-done' : ''}">
            <div class="day-title">
              <strong>${weekLabels[index]} (${day.date})</strong>
              <span>${day.tasks.length} 個任務</span>
            </div>
            ${day.tasks.length ? day.tasks.map(TaskCard).join('') : '<div class="empty">今天沒有任務</div>'}
          </div>
        `).join('')}
      </section>`;
    }

    function KanbanView(days) {
      return `<section class="kanban-grid" data-component="KanbanView">
        ${days.map((day, index) => `
          <div class="kanban-column card ${dateIsAllDone(day.tasks) ? 'all-done' : ''}">
            <div class="day-title">
              <strong>${mondayNames[index]}</strong>
              <span>${day.date}</span>
            </div>
            ${day.tasks.length ? day.tasks.map(TaskCard).join('') : '<div class="empty">無卡片</div>'}
          </div>
        `).join('')}
      </section>`;
    }

    function FrontPage() {
      const kid = state.db.settings.selectedKid;
      const days = tasksForWeek(kid);
      const tasks = days.flatMap(day => day.tasks);
      const done = tasks.filter(task => task.done).length;
      return `
        <header class="topbar">
          <div class="brand">
            <h1>親子學習週曆</h1>
            <span>${escapeHTML(kid)} 的本週任務</span>
          </div>
          <div class="actions">
            <button class="icon-btn ghost" title="深色模式" data-action="toggleTheme">${state.db.settings.darkMode ? '☀️' : '🌙'}</button>
          </div>
        </header>
        <main class="container">
          <div class="toolbar">
            ${KidSelector({ selected: kid })}
            <div class="segmented">
              <button class="${state.db.settings.viewMode === 'week' ? 'active' : ''}" data-action="setViewMode" data-mode="week">週方格模式</button>
              <button class="${state.db.settings.viewMode === 'kanban' ? 'active' : ''}" data-action="setViewMode" data-mode="kanban">看板模式</button>
            </div>
          </div>
          <section class="summary-strip">
            <div class="metric"><strong>${tasks.length}</strong><span>本週任務</span></div>
            <div class="metric"><strong>${done}</strong><span>已完成</span></div>
            <div class="metric"><strong>${tasks.filter(isVerified).length}</strong><span>家長確認</span></div>
          </section>
          ${state.db.settings.viewMode === 'kanban' ? KanbanView(days) : WeekGrid(days)}
        </main>
        <button class="admin-lock" title="家長後台" data-action="openAdmin">🔒</button>
      `;
    }

    function AdminPanel() {
      return `
        <header class="topbar">
          <div class="brand">
            <h1>家長後台</h1>
            <span>目前管理：${escapeHTML(state.db.settings.adminKid)}</span>
          </div>
          <div class="actions">
            <button class="ghost" data-action="goFront">回前台</button>
            <button class="icon-btn ghost" title="深色模式" data-action="toggleTheme">${state.db.settings.darkMode ? '☀️' : '🌙'}</button>
          </div>
        </header>
        <main class="container admin-layout" data-component="AdminPanel">
          <aside class="admin-stack">
            ${AdminToolbar()}
            ${SubjectManager()}
            ${FixedTaskManager()}
            ${ExportManager()}
          </aside>
          <section class="admin-stack">
            ${CalendarManager()}
            ${HistoryTable()}
          </section>
        </main>
      `;
    }

    function AdminToolbar() {
      return `<section class="panel card">
        <div class="panel-head"><h2>設定</h2></div>
        <div class="segmented">
          <button class="${state.db.settings.adminMode === 'single' ? 'active' : ''}" data-action="setAdminMode" data-mode="single">單人模式</button>
          <button class="${state.db.settings.adminMode === 'double' ? 'active' : ''}" data-action="setAdminMode" data-mode="double">雙人模式</button>
        </div>
        ${KidSelector({ selected: state.db.settings.adminKid, onClickName: 'selectAdminKid', compact: true })}
        <form class="inline-form" data-form="addKid">
          <label>新增人物<input name="kid" placeholder="例如：👶 弟弟" required></label>
          <button class="primary">新增</button>
        </form>
        <form class="inline-form" data-form="addSubject">
          <label>新增科目<input name="subject" placeholder="科目名稱" required></label>
          <button class="primary">新增</button>
        </form>
        <form class="inline-form" data-form="changePin">
          <label>修改PIN<input name="pin" minlength="4" placeholder="至少4碼" required></label>
          <button class="primary">儲存</button>
        </form>
        <button class="danger" data-action="resetWeek">本週重置</button>
      </section>`;
    }

    function SubjectManager() {
      return `<section class="panel card" data-component="SubjectManager">
        <div class="panel-head"><h2>科目管理</h2></div>
        <div class="list">
          ${state.db.subjects.map(subject => `
            <div class="list-row">
              <strong>${escapeHTML(subject.name)}</strong>
              <div class="switch-row">
                <button class="small ${subject.enabled ? 'primary' : ''}" data-action="setSubject" data-subject="${escapeHTML(subject.name)}" data-enabled="true">啟用</button>
                <button class="small ${!subject.enabled ? 'danger' : ''}" data-action="setSubject" data-subject="${escapeHTML(subject.name)}" data-enabled="false">停用</button>
              </div>
            </div>`).join('')}
        </div>
      </section>`;
    }

    function FixedTaskManager() {
      const subjects = enabledSubjects();
      const tasks = state.db.fixedTasks.filter(task => state.db.settings.adminMode === 'double' || task.kid === state.db.settings.adminKid);
      return `<section class="panel card" data-component="FixedTaskManager">
        <div class="panel-head"><h2>固定行程</h2></div>
        <form class="form-grid" data-form="addFixed">
          <label>星期
            <select name="dayOfWeek">${[1,2,3,4,5,6,0].map(day => `<option value="${day}">${dayNames[day]}</option>`).join('')}</select>
          </label>
          <label>科目
            <select name="subject">${subjects.map(subject => `<option value="${escapeHTML(subject)}">${escapeHTML(subject)}</option>`).join('')}</select>
          </label>
          <label style="grid-column: 1 / -1;">備註<input name="memo" placeholder="可留空"></label>
          <button class="primary" style="grid-column: 1 / -1;">新增</button>
        </form>
        <div class="list">
          ${tasks.length ? tasks.map(task => `
            <div class="list-row">
              <strong>${escapeHTML(task.kid)}｜${dayNames[task.dayOfWeek]}｜${escapeHTML(task.subject)}</strong>
              <button class="small danger" data-action="deleteFixed" data-id="${task.id}">刪除</button>
            </div>`).join('') : '<div class="empty">尚無固定任務</div>'}
        </div>
      </section>`;
    }

    function CalendarManager() {
      return `<section class="panel card" data-component="CalendarManager">
        <div class="panel-head">
          <h2>月曆區</h2>
          <span style="color: var(--muted); font-size: 14px;">點日期新增臨時任務</span>
        </div>
        <div id="calendar"></div>
      </section>`;
    }

    function HistoryTable() {
      ensureInstancesForCurrentYear();
      syncTempInstances();
      const kids = state.db.settings.adminMode === 'double' ? state.db.kids : [state.db.settings.adminKid];
      const tasks = allHistoryTasks().filter(task => kids.includes(task.kid)).sort(sortTasks);
      const subjects = [...new Set([...state.db.subjects.map(subject => subject.name), ...tasks.map(task => task.subject)])];
      return `<section class="panel card" data-component="HistoryTable">
        <div class="panel-head"><h2>歷史紀錄</h2></div>
        <div class="admin-stack">
          ${subjects.map(subject => {
            const rows = tasks.filter(task => task.subject === subject);
            return `<details ${rows.length ? '' : 'open'}>
              <summary>▶ ${escapeHTML(subject)} (${rows.length})</summary>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>類型</th><th>日期</th><th>備註</th><th>完成</th><th>審核</th><th>操作</th></tr></thead>
                  <tbody>
                    ${rows.length ? rows.map(task => HistoryRow(task)).join('') : '<tr><td colspan="6">沒有紀錄</td></tr>'}
                  </tbody>
                </table>
              </div>
            </details>`;
          }).join('')}
        </div>
      </section>`;
    }

    function HistoryRow(task) {
      const locked = isVerified(task);
      return `<tr>
        <td>${task.type === 'fixed' ? '固定' : '臨時'}<br><span style="color: var(--muted);">${escapeHTML(task.kid)}</span></td>
        <td>${task.date}</td>
        <td>${escapeHTML(task.memo || '—')}</td>
        <td>${task.done ? '已勾' : '未勾'}</td>
        <td>${locked ? '已審核 🔒' : task.done ? '可確認' : '待完成'}</td>
        <td>
          <div class="cell-actions">
            <button class="small" data-action="editTask" data-task-id="${task.id}" ${locked ? 'disabled' : ''}>修改</button>
            <button class="small primary" data-action="verifyTask" data-task-id="${task.id}" ${task.done && !locked ? '' : 'disabled'}>確認</button>
            <button class="small danger" data-action="deleteTask" data-task-id="${task.id}" ${locked ? 'disabled' : ''}>刪除</button>
          </div>
        </td>
      </tr>`;
    }

    function ExportManager() {
      return `<section class="panel card" data-component="ExportManager">
        <div class="panel-head"><h2>匯出匯入</h2></div>
        <button class="primary" data-action="exportJSON">JSON匯出</button>
        <label>JSON匯入<input type="file" accept="application/json,.json" data-action="importJSON"></label>
        <button class="primary" data-action="exportCSV">CSV匯出</button>
      </section>`;
    }

    function TaskModal(date, task = null) {
      const subjects = enabledSubjects();
      const selectedSubject = task?.subject || subjects[0] || '';
      const kid = task?.kid || state.db.settings.adminKid;
      return `<div class="modal-backdrop" data-modal>
        <form class="modal" data-form="${task ? 'saveTaskEdit' : 'addTemp'}">
          <h2>${task ? '修改任務' : `新增 ${date} 任務`}</h2>
          <input type="hidden" name="taskId" value="${task?.id || ''}">
          <input type="hidden" name="date" value="${date}">
          <label>小孩
            <select name="kid">${state.db.kids.map(item => `<option value="${escapeHTML(item)}" ${item === kid ? 'selected' : ''}>${escapeHTML(item)}</option>`).join('')}</select>
          </label>
          <label>科目
            <select name="subject">${subjects.map(subject => `<option value="${escapeHTML(subject)}" ${subject === selectedSubject ? 'selected' : ''}>${escapeHTML(subject)}</option>`).join('')}</select>
          </label>
          <label>備註<textarea name="memo">${escapeHTML(task?.memo || '')}</textarea></label>
          <div class="actions">
            <button type="button" class="ghost" data-action="closeModal">取消</button>
            <button class="primary">儲存</button>
          </div>
        </form>
      </div>`;
    }

    function renderCalendar() {
      if (state.screen !== 'admin') return;
      const el = document.getElementById('calendar');
      if (!el || !window.FullCalendar) return;
      if (state.calendar) state.calendar.destroy();
      const kids = state.db.settings.adminMode === 'double' ? state.db.kids : [state.db.settings.adminKid];
      const calendarEvents = () => allHistoryTasks().filter(task => kids.includes(task.kid)).map(task => ({
        id: task.id,
        title: `${task.kid} ${task.type === 'fixed' ? '🔄' : '⭐'} ${task.subject}${task.done ? ' ✓' : ''}`,
        start: task.date,
        backgroundColor: isVerified(task) ? '#b7791f' : task.done ? '#1f9d68' : '#4f7cff',
        borderColor: 'transparent'
      }));
      state.calendar = new FullCalendar.Calendar(el, {
        initialView: 'dayGridMonth',
        locale: 'zh-tw',
        height: 'auto',
        firstDay: 1,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listWeek' },
        events: calendarEvents(),
        dateClick: info => openTaskModal(info.dateStr),
        eventClick: info => {
          const task = state.db.taskInstances.find(item => item.id === info.event.id);
          if (task && !isVerified(task)) openTaskModal(task.date, task);
        },
        datesSet: info => {
          const end = new Date(info.end);
          end.setDate(end.getDate() - 1);
          ensureInstancesForRange(info.startStr.slice(0, 10), toISODate(end));
          syncTempInstances();
          Repository.save(state.db);
          if (state.calendar) {
            state.calendar.removeAllEvents();
            state.calendar.addEventSource(calendarEvents());
          }
        }
      });
      state.calendar.render();
    }

    function renderApp() {
      const app = document.getElementById('app');
      app.innerHTML = state.screen === 'admin' ? AdminPanel() : FrontPage();
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      requestAnimationFrame(renderCalendar);
    }

    function openTaskModal(date, task = null) {
      document.body.insertAdjacentHTML('beforeend', TaskModal(date, task));
    }

    function handleAction(target, event) {
      const action = target.dataset.action;
      if (!action) return;
      if (action === 'selectKid') {
        state.db.settings.selectedKid = target.dataset.kid;
        persist();
      }
      if (action === 'setViewMode') {
        state.db.settings.viewMode = target.dataset.mode;
        persist();
      }
      if (action === 'toggleDone') toggleDone(target.dataset.taskId);
      if (action === 'openAdmin') {
        const pin = prompt('請輸入家長PIN');
        if (pin === state.db.pin) {
          state.screen = 'admin';
          renderApp();
        } else if (pin !== null) toast('PIN 錯誤');
      }
      if (action === 'goFront') {
        state.screen = 'front';
        renderApp();
      }
      if (action === 'toggleTheme') {
        state.db.settings.darkMode = !state.db.settings.darkMode;
        persist();
      }
      if (action === 'setAdminMode') {
        state.db.settings.adminMode = target.dataset.mode;
        persist();
      }
      if (action === 'selectAdminKid') {
        state.db.settings.adminKid = target.dataset.kid;
        persist();
      }
      if (action === 'setSubject') {
        const subject = state.db.subjects.find(item => item.name === target.dataset.subject);
        if (subject) subject.enabled = target.dataset.enabled === 'true';
        persist();
      }
      if (action === 'resetWeek') resetThisWeek();
      if (action === 'deleteFixed') {
        const task = state.db.fixedTasks.find(item => item.id === target.dataset.id);
        if (task && confirm('確定刪除固定任務？既有歷史紀錄會保留。')) {
          state.db.fixedTasks = state.db.fixedTasks.filter(item => item.id !== task.id);
          persist();
        }
      }
      if (action === 'verifyTask') verifyTask(target.dataset.taskId);
      if (action === 'editTask') {
        const task = state.db.taskInstances.find(item => item.id === target.dataset.taskId);
        if (task) openTaskModal(task.date, task);
      }
      if (action === 'deleteTask') deleteTask(target.dataset.taskId);
      if (action === 'closeModal') target.closest('[data-modal]')?.remove();
      if (action === 'exportJSON') downloadFile('learning-calendar-backup.json', Repository.exportJSON(), 'application/json;charset=utf-8');
      if (action === 'exportCSV') downloadFile('learning-history.csv', Repository.exportCSV(), 'text/csv;charset=utf-8');
      if (action === 'importJSON' && event.type === 'change') importJSONFile(target.files[0]);
    }

    function handleSubmit(form, event) {
      event.preventDefault();
      const type = form.dataset.form;
      if (type === 'addKid') addKid(form.kid.value);
      if (type === 'addSubject') addSubject(form.subject.value);
      if (type === 'changePin') {
        state.db.pin = form.pin.value.trim();
        form.reset();
        persist();
        toast('PIN 已更新');
      }
      if (type === 'addFixed') addFixedTask(form);
      if (type === 'addTemp') {
        addTempTask({
          kid: form.kid.value,
          subject: form.subject.value,
          date: form.date.value,
          memo: form.memo.value
        });
        form.closest('[data-modal]')?.remove();
      }
      if (type === 'saveTaskEdit') {
        updateTask(form.taskId.value, {
          kid: form.kid.value,
          subject: form.subject.value,
          memo: form.memo.value.trim()
        });
        form.closest('[data-modal]')?.remove();
        toast('任務已更新');
      }
    }

    function importJSONFile(file) {
      if (!file) return;
      if (!confirm('此操作不可復原，確定要完全覆蓋目前資料？')) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          Repository.importJSON(reader.result);
          state.screen = 'front';
          renderApp();
          toast('JSON 已匯入');
        } catch {
          toast('JSON 格式不正確');
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (target) handleAction(target, event);
    });
    document.addEventListener('change', event => {
      const target = event.target.closest('[data-action]');
      if (target) handleAction(target, event);
    });
    document.addEventListener('submit', event => {
      const form = event.target.closest('form[data-form]');
      if (form) handleSubmit(form, event);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelector('[data-modal]')?.remove();
    });

    Repository.initialize();
    renderApp();
  </script>
</body>
</html>
