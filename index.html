<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>親子學習週曆</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f7;
      --text: #202735;
      --muted: #697386;
      --line: #d9e1ec;
      --primary: #4f7cff;
      --primary-2: #e6edff;
      --good: #1f9d68;
      --good-bg: #e3f7ed;
      --warn: #b7791f;
      --danger: #d64545;
      --shadow: 0 12px 28px rgba(31, 41, 55, .12);
      --radius: 16px;
      --radius-sm: 12px;
      --tap: 44px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #111827;
      --surface: #1f2937;
      --surface-2: #2d3748;
      --text: #f7fafc;
      --muted: #a8b3c7;
      --line: #3b4658;
      --primary: #7aa2ff;
      --primary-2: #22345f;
      --good: #4ade80;
      --good-bg: #163828;
      --warn: #f6c85f;
      --danger: #ff7777;
      --shadow: 0 12px 28px rgba(0, 0, 0, .36);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.4;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: var(--tap);
      border: 0;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      color: var(--text);
      background: var(--surface-2);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 38%, transparent);
      outline-offset: 2px;
    }

    input, select, textarea {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text);
      background: var(--surface);
    }

    textarea { min-height: 92px; resize: vertical; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; font-weight: 700; }
    h1, h2, h3 { margin: 0; line-height: 1.2; }
    h1 { font-size: clamp(22px, 4vw, 34px); }
    h2 { font-size: 20px; }
    h3 { font-size: 17px; }
    .app { min-height: 100vh; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px clamp(14px, 3vw, 24px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: grid; gap: 2px; }
    .brand span { color: var(--muted); font-size: 13px; }
    .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    .primary { background: var(--primary); color: white; }
    .undo-btn { background: #4b5563; color: white; font-weight: bold; }
    .redo-btn { background: #0d9488; color: white; font-weight: bold; }
    .admin-btn { background: #8b5cf6; color: white; font-weight: bold; }
    
    .danger { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); color: var(--danger); }
    .ghost { background: transparent; border: 1px solid var(--line); }
    .small { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 6px; }
    .icon-btn { width: 44px; padding: 0; display: inline-grid; place-items: center; }
    .container { max-width: 1440px; margin: 0 auto; padding: 16px clamp(12px, 3vw, 24px) 80px; }
    .hidden { display: none !important; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .kid-selector, .segmented { display: flex; gap: 8px; flex-wrap: wrap; }

    .kid-button {
      min-width: 120px;
      min-height: 50px;
      font-size: 18px;
      font-weight: 800;
      background: var(--surface);
      border: 2px solid var(--line);
    }

    .kid-button.active, .segmented button.active {
      color: white;
      background: var(--primary);
      border-color: var(--primary);
    }

    .segmented {
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    .segmented button { min-height: 36px; }
    
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 14px;
    }

    .metric {
      padding: 12px;
      display: grid;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .metric strong { font-size: 24px; }
    .metric span { color: var(--muted); font-size: 13px; }

    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(160px, 1fr));
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .kanban-column {
      min-width: 160px;
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .kanban-column.all-done {
      background: color-mix(in srgb, var(--good-bg) 70%, var(--surface));
      border-color: color-mix(in srgb, var(--good) 45%, var(--line));
    }

    .day-title { display: grid; gap: 2px; margin-bottom: 4px; }
    .day-title strong { font-size: 16px; }
    .day-title span { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; padding: 10px; border: 1px dashed var(--line); border-radius: var(--radius-sm); }

    .task-card {
      display: grid;
      gap: 4px;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .task-card.done { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
    .task-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .task-title { font-weight: 900; font-size: 16px; }
    .task-memo { color: var(--text); background: var(--surface-2); padding: 4px 6px; border-radius: 6px; font-size: 13px; border-left: 3px solid var(--primary); }
    
    .status-pill {
      min-height: 30px;
      border-radius: 999px;
      padding: 4px 8px;
      font-weight: 800;
      font-size: 12px;
    }
    .status-pill.done { color: var(--good); background: color-mix(in srgb, var(--good-bg) 80%, var(--surface)); }

    /* 後台排版佈局 */
    .admin-layout {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      gap: 14px;
    }

    .admin-stack { display: grid; gap: 12px; }
    .panel { padding: 14px; display: grid; gap: 10px; }
    .panel-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
    
    /* 緊湊型設定表單樣式 */
    .compact-form-group {
      display: grid;
      gap: 8px;
      background: var(--surface-2);
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px dashed var(--line);
    }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-items: end; }
    .inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
    
    .list { display: grid; gap: 8px; }
    .list-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--surface);
    }

    /* 限制特定按鈕觸發拖曳排序 */
    .drag-handle {
      cursor: grab;
      padding: 2px 6px;
      background: var(--surface-2);
      border-radius: 4px;
      font-weight: bold;
      user-select: none;
    }
    .drag-handle:active { cursor: grabbing; }
    .list-row.dragging { opacity: 0.4; background: var(--primary-2); border: 2px dashed var(--primary); }

    .calendar-container {
      min-height: 400px;
      height: 640px; 
      padding: 6px;
      resize: both; 
      overflow: auto; 
      border: 2px dashed var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    #calendar, #front-calendar { height: 100%; min-height: 100%; }

    .fc { font-size: 14px; }
    .fc .fc-button { min-height: 38px !important; padding: 4px 10px !important; }

    details.panel-details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    details.panel-details summary.panel-summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 18px;
      background: var(--surface-2);
      list-style: none;
    }
    .panel-content { padding: 12px; display: grid; gap: 10px; }

    /* 置物櫃樣式 */
    .history-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px;
      border: 2px dashed transparent;
      border-radius: var(--radius-sm);
      transition: background 0.2s, border-color 0.2s;
      min-height: 200px;
    }
    
    .history-flex.drag-container-over {
      background: color-mix(in srgb, var(--primary) 5%, transparent);
      border-color: var(--primary);
    }

    .book-card {
      width: 130px;
      height: 165px;
      border-radius: 4px 10px 10px 4px;
      padding: 12px 10px;
      background: #f1f5f9; 
      border: 1px solid #cbd5e1;
      border-left: 9px solid #94a3b8; 
      color: #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: grab;
      box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.04);
      user-select: none;
      position: relative;
    }
    [data-theme="dark"] .book-card { background: #334155; border: 1px solid #475569; border-left-color: #64748b; color: #f1f5f9; }
    .book-card:hover { transform: translateY(-2px); background: #e2e8f0; }
    .book-card.active { border: 2px solid var(--primary); opacity: 0.6; }
    
    .book-card.folder-type.drag-over {
      background: var(--primary-2) !important;
      border: 2px dashed var(--primary) !important;
      transform: scale(1.04);
    }

    /* 🎨 優化：打開/未打開資料夾卡片與內部書本變黯淡、稍有不同 */
    .book-card.folder-type { background: #e2e8f0; border-left: 9px solid #cbd5e1; border-color: #bfa3cd; }
    [data-theme="dark"] .book-card.folder-type { background: #1e293b; border-left-color: #475569; }
    
    /* 打開狀態：外層更深邃 */
    .book-card.folder-type.folder-open { background: #cbd5e1; border-left-color: #94a3b8; }
    [data-theme="dark"] .book-card.folder-type.folder-open { background: #111827; }

    /* 內層子書籍：顯著調暗，避免死白 */
    .book-card.is-child { border-left: 7px solid #78889b; background: #e2e8f0; border-color: #b4c2d3; color: #475569; }
    [data-theme="dark"] .book-card.is-child { background: #1f2937; color: #cbd5e1; }
    .book-card.is-child::before {
      content: "📂"; position: absolute; top: 4px; right: 6px; font-size: 11px; opacity: 0.4;
    }

    /* 資料夾刪除小按鈕 */
    .folder-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      min-height: 22px;
      padding: 0;
      font-size: 11px;
      display: grid;
      place-items: center;
      background: rgba(214, 69, 69, 0.15);
      color: var(--danger);
      border-radius: 4px;
      z-index: 5;
    }
    .folder-delete-btn:hover { background: var(--danger); color: white; transform: none; }

    /* 樹狀結構階層指示線（選填視覺） */
    .tree-node-title {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface-2);
      padding: 2px 4px;
      border-radius: 4px;
      word-break: break-all;
      margin-bottom: 4px;
    }

    .bookshelf-divider { width: 100%; height: 2px; background: var(--line); margin: 6px 0; display: block; }
    .bookshelf-section-title { width: 100%; font-size: 13px; font-weight: bold; color: var(--muted); margin: 6px 4px 2px; }

    .book-title {
      font-weight: 800; font-size: 14px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
      overflow: hidden; text-overflow: ellipsis; word-break: break-all;
    }
    .book-count {
      font-size: 11px; font-weight: bold; background: rgba(0, 0, 0, 0.06); color: #475569;
      padding: 2px 4px; border-radius: 4px; align-self: flex-start;
    }
    [data-theme="dark"] .book-count { background: rgba(255, 255, 255, 0.1); color: #cbd5e1; }

    .table-drawer-bottom {
      width: 100%; margin-top: 14px; background: var(--surface);
      border-radius: var(--radius); border: 1px solid var(--line); padding: 14px;
    }
    
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; }
    th { background: var(--surface-2); color: var(--muted); font-size: 13px; }
    td { font-size: 14px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(15, 23, 42, .55); }
    .modal { width: min(480px, 100%); padding: 18px; display: grid; gap: 12px; background: var(--surface); border-radius: var(--radius); }
    .toast { position: fixed; left: 50%; bottom: 18px; z-index: 80; transform: translateX(-50%); padding: 10px 14px; border-radius: 999px; color: white; background: #1f2937; font-weight: 800; font-size: 15px; }

    @media (max-width: 1080px) {
      .admin-layout { grid-template-columns: 1fr; }
      .kanban-grid { grid-template-columns: repeat(7, minmax(180px, 1fr)); }
    }
    @media (max-width: 760px) {
      .kanban-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    const STORAGE_KEY = 'learning-calendar-v3';
    const VERSION = '1.7.0';
    const dayNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const mondayNames = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];

    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
    const pad = value => String(value).padStart(2, '0');
    const toISODate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    
    const fromISODate = iso => {
      const [year, month, day] = iso.split('-').map(Number);
      return new Date(year, month - 1, day);
    };
    const todayISO = () => toISODate(new Date());
    
    const startOfWeek = date => {
      const copy = new Date(date);
      const day = copy.getDay();
      const offset = day === 0 ? -6 : 1 - day;
      copy.setDate(copy.getDate() + offset);
      copy.setHours(0, 0, 0, 0);
      return copy;
    };
    
    const weekDates = (base = new Date()) => Array.from({ length: 7 }, (_, index) => {
      const date = startOfWeek(base);
      date.setDate(date.getDate() + index);
      return toISODate(date);
    });

    const escapeHTML = text => String(text ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    })[char]);

    function createDefaultData() {
      return {
        version: VERSION,
        pin: '1234',
        kids: ['👦 哥哥', '👧 妹妹'],
        subjects: [
          { name: '數學1', folder: '數學>小學', enabled: true },
          { name: '書2', folder: '大班', enabled: true },
          { name: '英文套書', folder: '', enabled: true },
          { name: '國文閱讀', folder: '', enabled: true }
        ],
        folders: ['數學>小學', '大班', '數學'], 
        fixedTasks: [],
        tempTasks: [],
        taskInstances: [],
        settings: {
          selectedKid: '👦 哥哥',
          viewMode: 'week', 
          adminMode: 'single',
          adminKid: '👦 哥哥',
          darkMode: false,
          disablePin: false
        }
      };
    }

    const DataModel = {
      normalize(input) {
        const base = createDefaultData();
        const data = { ...base, ...(input || {}) };
        data.version = VERSION;
        data.pin = String(data.pin || '1234');
        data.kids = Array.isArray(data.kids) && data.kids.length ? data.kids.map(String) : base.kids;
        
        data.subjects = Array.isArray(data.subjects) ? data.subjects.map(subject => ({
          name: String(subject.name || '').trim(),
          folder: String(subject.folder || '').replace(/＞/g, '>').trim(), 
          enabled: subject.enabled !== false
        })).filter(subject => subject.name) : base.subjects;
        
        data.folders = Array.isArray(data.folders) ? data.folders.map(f => String(f || '').replace(/＞/g, '>').trim()).filter(Boolean) : base.folders;
        
        data.subjects.forEach(s => {
          if (s.folder && !data.folders.includes(s.folder)) {
            data.folders.push(s.folder);
          }
        });

        // 自動展開或補齊樹狀結構父節點到 folders 中
        const extraFolders = [];
        data.folders.forEach(f => {
          const parts = f.split('>');
          for(let i=1; i<=parts.length; i++) {
            const subPath = parts.slice(0, i).join('>');
            if (subPath && !data.folders.includes(subPath) && !extraFolders.includes(subPath)) {
              extraFolders.push(subPath);
            }
          }
        });
        data.folders = [...data.folders, ...extraFolders];

        data.fixedTasks = Array.isArray(data.fixedTasks) ? data.fixedTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          dayOfWeek: Number(task.dayOfWeek) || 0,
          memo: String(task.memo || '')
        })).filter(task => task.subject) : [];
        
        data.tempTasks = Array.isArray(data.tempTasks) ? data.tempTasks.map(task => ({
          id: task.id || uid(),
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        
        data.taskInstances = Array.isArray(data.taskInstances) ? data.taskInstances.map(task => ({
          id: task.id || uid(),
          sourceId: task.sourceId || '',
          type: task.type === 'temp' ? 'temp' : 'fixed',
          kid: data.kids.includes(task.kid) ? task.kid : data.kids[0],
          subject: String(task.subject || data.subjects[0]?.name || '').trim(),
          date: /^\d{4}-\d{2}-\d{2}$/.test(task.date) ? task.date : todayISO(),
          memo: String(task.memo || ''),
          done: Boolean(task.done)
        })).filter(task => task.subject) : [];
        
        data.settings = { ...base.settings, ...(data.settings || {}) };
        return data;
      }
    };

    const Repository = {
      initialize() {
        const loaded = this.load();
        state.db = loaded ? DataModel.normalize(loaded) : createDefaultData();
        this.save(state.db);
        return state.db;
      },
      save(data = state.db) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DataModel.normalize(data)));
      },
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      },
      exportJSON() { return JSON.stringify(DataModel.normalize(state.db), null, 2); },
      importJSON(jsonText) {
        state.db = DataModel.normalize(JSON.parse(jsonText));
        this.save(state.db);
        return state.db;
      },
      exportCSV() {
        const rows = [['小孩', '日期', '科目', '備註', '狀態']];
        allHistoryTasks().filter(t => t.done).sort(sortTasksDesc).forEach(task => {
          rows.push([task.kid, task.date, task.subject, task.memo, '已完成']);
        });
        return rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      }
    };

    const state = {
      db: null,
      screen: 'front',
      currentWeek: startOfWeek(new Date()),
      calendar: null,
      frontCalendar: null,
      undoStack: [],
      redoStack: [],
      clockInterval: null,
      expandedFolders: {}, 
      activeHistoryBook: null
    };

    function csvCell(value) {
      const text = String(value ?? '');
      return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function snapshot() {
      if (state.undoStack.length > 25) state.undoStack.shift();
      state.undoStack.push(JSON.stringify(state.db));
      state.redoStack = []; 
    }

    function triggerUndo() {
      if (!state.undoStack.length) return toast('沒有上一動紀錄可以恢復');
      state.redoStack.push(JSON.stringify(state.db)); 
      const previous = state.undoStack.pop();
      state.db = DataModel.normalize(JSON.parse(previous));
      persist(true, false);
      toast('已成功恢復上一動 ↩');
    }

    function triggerRedo() {
      if (!state.redoStack.length) return toast('沒有可以取消復原的動作');
      state.undoStack.push(JSON.stringify(state.db)); 
      const nextState = state.redoStack.pop();
      state.db = DataModel.normalize(JSON.parse(nextState));
      persist(true, false);
      toast('已取消復原 ↪');
    }

    function persist(render = true, createSnapshot = true) {
      if (createSnapshot) snapshot();
      state.db = DataModel.normalize(state.db);
      Repository.save(state.db);
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      if (render) renderApp();
    }

    function enabledSubjects() {
      return state.db.subjects.filter(subject => subject.enabled).map(subject => subject.name);
    }

    function isSubjectEnabled(name) {
      return state.db.subjects.some(subject => subject.name === name && subject.enabled);
    }

    function sortTasksDesc(a, b) {
      return b.date.localeCompare(a.date) || a.kid.localeCompare(b.kid) || a.subject.localeCompare(b.subject);
    }

    function generateInstancesForSingleMonth(baseISO, fixedTaskRule) {
      const pivotDate = fromISODate(baseISO);
      const year = pivotDate.getFullYear();
      const targetMonth = pivotDate.getMonth();
      const firstDayOfMonth = new Date(year, targetMonth, 1);
      const lastDayOfMonth = new Date(year, targetMonth + 1, 0);

      let cursor = new Date(firstDayOfMonth);
      while (cursor <= lastDayOfMonth) {
        if (cursor.getDay() === Number(fixedTaskRule.dayOfWeek)) {
          state.db.taskInstances.push({
            id: uid(),
            sourceId: fixedTaskRule.id,
            type: 'fixed',
            kid: fixedTaskRule.kid,
            subject: fixedTaskRule.subject,
            date: toISODate(cursor),
            memo: fixedTaskRule.memo,
            done: false
          });
        }
        cursor.setDate(cursor.getDate() + 1);
      }
    }

    function syncTempInstances() {
      const fixedInstances = state.db.taskInstances.filter(task => task.type !== 'temp');
      const tempInstances = state.db.tempTasks.map(task => ({
        id: task.id, sourceId: task.id, type: 'temp', kid: task.kid, subject: task.subject, date: task.date, memo: task.memo, done: task.done
      }));
      state.db.taskInstances = [...fixedInstances, ...tempInstances];
    }

    function allHistoryTasks() {
      syncTempInstances();
      return state.db.taskInstances;
    }

    function tasksForWeek(kid) {
      const dates = weekDates(state.currentWeek);
      syncTempInstances();
      return dates.map(date => ({
        date,
        tasks: state.db.taskInstances
          .filter(task => task.kid === kid && task.date === date && isSubjectEnabled(task.subject))
          .sort((a, b) => a.type.localeCompare(b.type) || a.subject.localeCompare(b.subject))
      }));
    }

    function dateIsAllDone(tasks) {
      return tasks.length > 0 && tasks.every(task => task.done);
    }

    function addKid(name) {
      const clean = name.trim();
      if (!clean || state.db.kids.includes(clean)) return toast('人物名稱重複或空白');
      snapshot();
      state.db.kids.push(clean);
      persist(true, false);
    }

    function deleteKid(name) {
      if (state.db.kids.length <= 1) return toast('至少需要保留一位成員');
      if (!confirm(`確定要刪除「${name}」？`)) return;
      snapshot();
      state.db.kids = state.db.kids.filter(k => k !== name);
      persist(true, false);
    }

    function handleFlexibleAdd(subjectText, folderText) {
      const sName = subjectText.trim();
      const fName = folderText.replace(/＞/g, '>').trim();

      if (!sName && !fName) return toast('請至少輸入科目書名或資料夾名稱');

      snapshot();
      
      if (!sName && fName) {
        if (state.db.folders.includes(fName)) return toast('此資料夾已存在');
        state.db.folders.push(fName);
        toast(`已成功建立空資料夾：📂 ${fName.replace(/>/g, ' ＞ ')}`);
      }
      else if (sName && !fName) {
        if (state.db.subjects.some(s => s.name === sName)) return toast('書名重複');
        state.db.subjects.push({ name: sName, folder: '', enabled: true });
        toast(`已新增散書：📘 ${sName}`);
      }
      else if (sName && fName) {
        if (state.db.subjects.some(s => s.name === sName)) return toast('書名重複');
        if (!state.db.folders.includes(fName)) {
          state.db.folders.push(fName);
        }
        state.db.subjects.push({ name: sName, folder: fName, enabled: true });
        toast(`已將書籍 📘 ${sName} 加入 📂 ${fName.replace(/>/g, ' ＞ ')}`);
      }
      persist(true, false);
    }

    function deleteSubject(name) {
      if (!confirm(`確定刪除科目「${name}」？`)) return;
      snapshot();
      state.db.subjects = state.db.subjects.filter(s => s.name !== name);
      persist(true, false);
    }

    // 🗑️ 刪除資料夾功能：資料夾內的書變成散書
    function deleteFolder(folderPath) {
      if (!confirm(`確定刪除資料夾「${folderPath.replace(/>/g, ' ＞ ')}」嗎？\n注意：裡面的書將會釋放出來變成獨立散書。`)) return;
      snapshot();
      
      // 1. 先將直接屬於這個資料夾路徑的書解放（清空資料夾欄位）
      state.db.subjects.forEach(sub => {
        if (sub.folder === folderPath) {
          sub.folder = '';
        }
        // 同時處理子資料夾路徑的情況
        else if (sub.folder.startsWith(folderPath + '>')) {
          sub.folder = sub.folder.substring(folderPath.length + 1);
        }
      });

      // 2. 移除資料夾本身
      state.db.folders = state.db.folders.filter(f => f !== folderPath && !f.startsWith(folderPath + '>'));
      
      toast('資料夾已移除，書本已變回散書');
      persist(true, false);
    }

    function addFixedTask(form) {
      const subject = form.subject.value;
      if (!subject) return toast('請先建立科目');
      snapshot();
      const newFixed = {
        id: uid(), kid: state.db.settings.adminKid, subject, dayOfWeek: Number(form.dayOfWeek.value), memo: form.memo.value.trim()
      };
      state.db.fixedTasks.push(newFixed);
      generateInstancesForSingleMonth(todayISO(), newFixed);
      form.reset();
      persist(true, false);
      toast('固定行程已發布！');
    }

    function addTempTask({ kid, subject, date, memo }) {
      if (!subject || !date) return toast('請選擇日期與科目');
      snapshot();
      state.db.tempTasks.push({ id: uid(), kid, subject, date, memo: memo.trim(), done: false });
      persist(true, false);
    }

    function updateTask(taskId, updates) {
      snapshot();
      const temp = state.db.tempTasks.find(task => task.id === taskId);
      if (temp) Object.assign(temp, updates);
      const instance = state.db.taskInstances.find(task => task.id === taskId);
      if (instance) Object.assign(instance, updates);
      persist(true, false);
    }

    function deleteTask(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId) || state.db.tempTasks.find(item => item.id === taskId);
      if (!task || !confirm('確定刪除這筆任務？')) return;
      snapshot();
      state.db.tempTasks = state.db.tempTasks.filter(item => item.id !== taskId);
      state.db.taskInstances = state.db.taskInstances.filter(item => item.id !== taskId);
      persist(true, false);
    }

    function toggleDone(taskId) {
      const task = state.db.taskInstances.find(item => item.id === taskId);
      if (!task) return;
      snapshot();
      task.done = !task.done; 
      const temp = state.db.tempTasks.find(item => item.id === taskId);
      if (temp) temp.done = task.done;
      persist(true, false);
    }

    function deleteFixedTaskRule(ruleId) {
      if (!confirm('確定刪除固定行程規則？')) return;
      snapshot();
      state.db.fixedTasks = state.db.fixedTasks.filter(item => item.id !== ruleId);
      state.db.taskInstances = state.db.taskInstances.filter(item => !(item.sourceId === ruleId && !item.done));
      persist(true, false);
    }

    function resetThisWeek() {
      if (!confirm('確定清除本週完成狀態？')) return;
      snapshot();
      const dates = new Set(weekDates(state.currentWeek));
      state.db.taskInstances.forEach(task => { if (dates.has(task.date)) task.done = false; });
      state.db.tempTasks.forEach(task => { if (dates.has(task.date)) task.done = false; });
      persist(true, false);
    }

    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename;
      document.body.appendChild(link);
      link.click(); link.remove(); URL.revokeObjectURL(url);
    }

    function toast(message) {
      document.querySelector('.toast')?.remove();
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2000);
    }

    function startLiveClock() {
      if (state.clockInterval) clearInterval(state.clockInterval);
      const clockEl = document.getElementById('liveClock');
      if (!clockEl) return;
      const updateClock = () => {
        const now = new Date();
        clockEl.textContent = `現在時間：${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日 (${dayNames[now.getDay()]}) ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      };
      updateClock();
      state.clockInterval = setInterval(updateClock, 1000);
    }

    // 🌳 樹狀圖歷史置物櫃引擎（實現資料夾1>小學>書1、空資料夾與獨立散書）
    function HistoryTable() {
      syncTempInstances();
      const kids = state.db.settings.adminMode === 'multi' ? state.db.kids : [state.db.settings.adminKid];
      const tasks = allHistoryTasks().filter(task => kids.includes(task.kid) && task.done).sort(sortTasksDesc);
      
      const definedSubjects = state.db.subjects;
      const independentBooks = [];
      const renderedSubjectsSet = new Set();

      // 1. 初始化資料夾樹結構
      const treeFolders = {};
      state.db.folders.forEach(fPath => {
        treeFolders[fPath] = { books: [], isRegistered: true };
      });

      // 2. 把書本丟到對應資料夾
      definedSubjects.forEach(sub => {
        renderedSubjectsSet.add(sub.name);
        if (sub.folder && sub.folder.trim() !== '') {
          const fPath = sub.folder.trim();
          if (!treeFolders[fPath]) treeFolders[fPath] = { books: [], isRegistered: false };
          treeFolders[fPath].books.push(sub.name);
        } else {
          independentBooks.push(sub.name);
        }
      });

      // 處理有歷史任務但後來設定檔中被拔除或未定義的科目，歸為獨立散書
      const historicalSubjects = [...new Set(tasks.map(task => task.subject))];
      historicalSubjects.forEach(subName => {
        if (!renderedSubjectsSet.has(subName)) {
          independentBooks.push(subName);
        }
      });

      let bookshelfHtml = '';

      // 3. 渲染資料夾樹狀節點（包含多層級解析）
      Object.keys(treeFolders).sort((a,b) => a.localeCompare(b)).forEach(folderPath => {
        const isOpen = !!state.expandedFolders[folderPath];
        const childrenBookNames = treeFolders[folderPath].books;
        
        // 計算該層級或子層級的所有記錄數
        const totalFolderRecords = tasks.filter(t => {
          const subObj = definedSubjects.find(s => s.name === t.subject);
          return subObj && (subObj.folder === folderPath || subObj.folder.startsWith(folderPath + '>'));
        }).length;

        // 將路徑美化顯示，例如 資料夾1 > 小學
        const displayPath = folderPath.replace(/>/g, ' ＞ ');

        bookshelfHtml += `
          <div class="book-card folder-type ${isOpen ? 'folder-open' : ''}" 
               data-action="toggleFolder" 
               data-folder="${escapeHTML(folderPath)}"
               data-drop-target="folder"
               data-folder-name="${escapeHTML(folderPath)}">
            <button class="folder-delete-btn" data-action="clickDeleteFolder" data-folder="${escapeHTML(folderPath)}">🗑️</button>
            <div class="book-title" style="color: #6366f1; font-size: 13px;">📂 ${escapeHTML(displayPath)}</div>
            <div class="book-count">書籍:${childrenBookNames.length} 筆數:${totalFolderRecords}</div>
          </div>
        `;

        if (isOpen) {
          childrenBookNames.forEach(subName => {
            const rowsCount = tasks.filter(t => t.subject === subName).length;
            const isBookActive = (state.activeHistoryBook && state.activeHistoryBook.subject === subName);
            
            bookshelfHtml += `
              <div class="book-card is-child ${isBookActive ? 'active' : ''}" 
                   draggable="true"
                   data-drag-type="book"
                   data-subject-name="${escapeHTML(subName)}"
                   data-action="selectHistoryBook" 
                   data-subject="${escapeHTML(subName)}" 
                   data-path="${escapeHTML(displayPath)} ＞ ${escapeHTML(subName)}">
                <div class="tree-node-title">📄 內含</div>
                <div class="book-title">📘 ${escapeHTML(subName)}</div>
                <div class="book-count">📋 ${rowsCount} 筆</div>
              </div>
            `;
          });
        }
      });

      // 獨立散書區塊
      bookshelfHtml += `<div class="bookshelf-divider"></div>`;
      bookshelfHtml += `<div class="bookshelf-section-title">✨ 獨立散書</div>`;

      independentBooks.forEach(subName => {
        const rowsCount = tasks.filter(t => t.subject === subName).length;
        const isBookActive = (state.activeHistoryBook && state.activeHistoryBook.subject === subName);

        bookshelfHtml += `
          <div class="book-card" 
               draggable="true"
               data-drag-type="book"
               data-subject-name="${escapeHTML(subName)}"
               data-action="selectHistoryBook" 
               data-subject="${escapeHTML(subName)}" 
               data-path="獨立散書 ＞ ${escapeHTML(subName)}">
            <div class="book-title">📘 ${escapeHTML(subName)}</div>
            <div class="book-count">📋 ${rowsCount} 筆</div>
          </div>
        `;
      });

      let drawerHtml = '';
      if (state.activeHistoryBook) {
        const currentTargetSubject = state.activeHistoryBook.subject;
        const currentPathName = state.activeHistoryBook.path;
        const filteredRows = tasks.filter(task => task.subject === currentTargetSubject);

        drawerHtml = `
          <div class="table-drawer-bottom">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <h3 style="font-weight:900; font-size:15px;">📊 項目：<span style="color:var(--primary);">${escapeHTML(currentPathName)}</span></h3>
              <button class="small ghost" style="min-height:26px; padding:2px 8px;" data-action="closeHistoryDrawer">✕ 關閉</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>成員</th><th>日期</th><th>備註</th><th>狀態</th><th>操作</th></tr></thead>
                <tbody>
                  ${filteredRows.length ? filteredRows.map(task => HistoryRow(task)).join('') : '<tr><td colspan="5" style="color: var(--muted); padding: 8px; text-align:center;">無紀錄</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      return `<section class="panel card" data-component="HistoryTable">
        <div class="panel-head">
          <div><h2>🗂 歷史紀錄置物櫃</h2></div>
        </div>
        <div class="history-flex" id="historyFlexContainer">${bookshelfHtml}</div>
        ${drawerHtml}
      </section>`;
    }

    function HistoryRow(task) {
      return `<tr>
        <td><strong>${escapeHTML(task.kid)}</strong></td>
        <td><span style="font-family: monospace;">${task.date}</span></td>
        <td style="white-space: pre-wrap; word-break: break-all;">${escapeHTML(task.memo || '—')}</td>
        <td><span style="color:var(--good);font-weight:bold;font-size:12px;">✅ 完成</span></td>
        <td>
          <div class="cell-actions">
            <button class="small ghost" style="min-height:26px; padding:2px 6px;" data-action="editTask" data-task-id="${task.id}">改</button>
            <button class="small danger" style="min-height:26px; padding:2px 6px; background:var(--danger); color:white;" data-action="deleteTask" data-task-id="${task.id}">刪</button>
          </div>
        </td>
      </tr>`;
    }

    function ExportManager() {
      return `
      <details class="panel-details card">
        <summary class="panel-summary">💾 備份與匯出</summary>
        <div class="panel-content" style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="primary small" style="flex:1" data-action="exportJSON">匯出JSON備份</button>
          <button class="primary small" style="flex:1" data-action="exportCSV">匯出CSV報表</button>
          <label style="width:100%">匯入備份<input type="file" accept=".json" data-action="importJSON"></label>
        </div>
      </details>`;
    }

    function TaskModal(date, task = null) {
      const subjects = enabledSubjects();
      const selectedSubject = task?.subject || subjects[0] || '';
      const kid = task?.kid || state.db.settings.adminKid;
      return `<div class="modal-backdrop" data-modal>
        <form class="modal" data-form="${task ? 'saveTaskEdit' : 'addTemp'}">
          <h2>${task ? '修改任務內容' : `新增 ${date} 臨時任務`}</h2>
          <input type="hidden" name="taskId" value="${task?.id || ''}">
          <input type="hidden" name="date" value="${date}">
          <label>小孩<select name="kid">${state.db.kids.map(item => `<option value="${escapeHTML(item)}" ${item === kid ? 'selected' : ''}>${escapeHTML(item)}</option>`).join('')}</select></label>
          <label>科目<select name="subject">${subjects.map(subject => `<option value="${escapeHTML(subject)}" ${subject === selectedSubject ? 'selected' : ''}>${escapeHTML(subject)}</option>`).join('')}</select></label>
          <label>備註<textarea name="memo">${escapeHTML(task?.memo || '')}</textarea></label>
          <div class="actions" style="display: flex; justify-content: flex-end; gap: 6px;">
            <button type="button" class="ghost small" data-action="closeModal">取消</button>
            ${task ? `<button type="button" class="danger small" style="background:var(--danger);color:white;" data-action="deleteTask" data-task-id="${task.id}">刪除排程</button>` : ''}
            <button class="primary small">儲存</button>
          </div>
        </form>
      </div>`;
    }

    function renderCalendar() {
      if (state.screen === 'admin') {
        startLiveClock();
        const el = document.getElementById('calendar');
        if (!el || !window.FullCalendar) return;
        if (state.calendar) state.calendar.destroy();
        const kids = state.db.settings.adminMode === 'multi' ? state.db.kids : [state.db.settings.adminKid];
        
        const getEvents = () => allHistoryTasks().filter(task => kids.includes(task.kid) && isSubjectEnabled(task.subject)).map(task => ({
          id: task.id,
          title: `${task.kid}: ${task.subject}${task.memo ? ' ('+task.memo+')' : ''}${task.done ? ' ✓' : ''}`,
          start: task.date,
          backgroundColor: task.done ? '#1f9d68' : '#4f7cff',
          borderColor: 'transparent'
        }));

        state.calendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth', locale: 'zh-tw', height: '100%', firstDay: 1, fixedWeekCount: false, 
          headerToolbar: { left: 'prev,next', center: 'title', right: '' },
          events: getEvents(),
          dateClick: info => openTaskModal(info.dateStr),
          eventClick: info => {
            const task = state.db.taskInstances.find(item => item.id === info.event.id);
            if (task) openTaskModal(task.date, task);
          }
        });
        state.calendar.render();
      }

      if (state.screen === 'front' && state.db.settings.viewMode === 'month') {
        const el = document.getElementById('front-calendar');
        if (!el || !window.FullCalendar) return;
        if (state.frontCalendar) state.frontCalendar.destroy();
        const currentKid = state.db.settings.selectedKid;

        const getFrontEvents = () => allHistoryTasks().filter(task => task.kid === currentKid && isSubjectEnabled(task.subject)).map(task => ({
          id: task.id,
          title: `${task.subject}${task.memo ? '\n📝 '+task.memo : ''}${task.done ? ' (✅)' : ''}`,
          start: task.date,
          backgroundColor: task.done ? '#1f9d68' : '#e2e8f0',
          textColor: task.done ? '#ffffff' : '#1e293b',
          borderColor: 'transparent'
        }));

        state.frontCalendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth', locale: 'zh-tw', height: '100%', firstDay: 1, fixedWeekCount: false, 
          headerToolbar: { left: 'prev,next', center: 'title', right: '' },
          events: getFrontEvents(),
          eventClick: info => toggleDone(info.event.id)
        });
        state.frontCalendar.render();
      }
    }

    function renderApp() {
      const app = document.getElementById('app');
      app.innerHTML = state.screen === 'admin' ? AdminPanel() : FrontPage();
      document.documentElement.dataset.theme = state.db.settings.darkMode ? 'dark' : 'light';
      initDragAndDrop(); 
      requestAnimationFrame(renderCalendar);
    }

    let draggedItemIdx = null;

    function initDragAndDrop() {
      // 🔒 修正後的拖曳手把排序邏輯
      const sortableList = document.getElementById('sortableSubjectList');
      if (sortableList) {
        const items = sortableList.querySelectorAll('.sortable-item');
        items.forEach(item => {
          const handle = item.querySelector('.drag-handle');
          
          handle.addEventListener('dragstart', (e) => {
            draggedItemIdx = item.dataset.index;
            item.classList.add('dragging');
            e.dataTransfer.setData('text/html', item.innerHTML);
          });
          
          handle.addEventListener('dragend', () => {
            item.classList.remove('dragging');
            draggedItemIdx = null;
          });

          item.addEventListener('dragover', (e) => {
            e.preventDefault();
            const overItem = e.target.closest('.sortable-item');
            if (overItem && draggedItemIdx !== null) {
              const currentIdx = Number(draggedItemIdx);
              const targetIdx = Number(overItem.dataset.index);
              if (currentIdx !== targetIdx) {
                snapshot();
                const temp = state.db.subjects[currentIdx];
                state.db.subjects.splice(currentIdx, 1);
                state.db.subjects.splice(targetIdx, 0, temp);
                draggedItemIdx = targetIdx; 
                persist(true, false);
              }
            }
          });
        });
      }

      // 置物櫃雙向移動系統
      const bookCards = document.querySelectorAll('.book-card[draggable="true"]');
      const folderCards = document.querySelectorAll('.book-card[data-drop-target="folder"]');
      const historyContainer = document.getElementById('historyFlexContainer');

      bookCards.forEach(book => {
        book.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', book.dataset.subjectName);
          book.classList.add('active');
        });
        book.addEventListener('dragend', () => { book.classList.remove('active'); });
      });

      folderCards.forEach(folder => {
        folder.addEventListener('dragover', (e) => { e.preventDefault(); folder.classList.add('drag-over'); });
        folder.addEventListener('dragleave', () => { folder.classList.remove('drag-over'); });
        folder.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation(); 
          folder.classList.remove('drag-over');
          const targetBookName = e.dataTransfer.getData('text/plain');
          const destFolderName = folder.dataset.folderName;

          if (targetBookName && destFolderName) {
            snapshot();
            const foundSubject = state.db.subjects.find(s => s.name === targetBookName);
            if (foundSubject) {
              foundSubject.folder = destFolderName;
              toast(`已將 📘 ${targetBookName} 歸類至 📂 ${destFolderName.replace(/>/g, ' ＞ ')}`);
            } else {
              state.db.subjects.push({ name: targetBookName, folder: destFolderName, enabled: true });
              toast(`已建立科目並歸類至 📂 ${destFolderName.replace(/>/g, ' ＞ ')}`);
            }
            state.expandedFolders[destFolderName] = true; 
            persist(true, false);
          }
        });
      });

      if (historyContainer) {
        historyContainer.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!e.target.closest('[data-drop-target="folder"]')) {
            historyContainer.classList.add('drag-container-over');
          } else {
            historyContainer.classList.remove('drag-container-over');
          }
        });

        historyContainer.addEventListener('dragleave', (e) => {
          if (e.target === historyContainer) {
            historyContainer.classList.remove('drag-container-over');
          }
        });

        historyContainer.addEventListener('drop', (e) => {
          e.preventDefault();
          historyContainer.classList.remove('drag-container-over');
          if (e.target.closest('[data-drop-target="folder"]')) return;

          const targetBookName = e.dataTransfer.getData('text/plain');
          if (targetBookName) {
            snapshot();
            const foundSubject = state.db.subjects.find(s => s.name === targetBookName);
            if (foundSubject) {
              if (foundSubject.folder !== '') {
                foundSubject.folder = ''; 
                toast(`已將 📘 ${targetBookName} 移出資料夾，回復為獨立散書`);
                persist(true, false);
              }
            }
          }
        });
      }
    }

    function openTaskModal(date, task = null) {
      document.body.insertAdjacentHTML('beforeend', TaskModal(date, task));
    }

    function handleAction(target, event) {
      const action = target.dataset.action;
      if (!action) return;
      if (action === 'undoAction') triggerUndo();
      if (action === 'redoAction') triggerRedo();
      if (action === 'selectKid') { state.db.settings.selectedKid = target.dataset.kid; persist(true, false); }
      if (action === 'setViewMode') { state.db.settings.viewMode = target.dataset.mode; persist(true, false); }
      if (action === 'toggleDone') toggleDone(target.dataset.taskId);
      if (action === 'openAdmin') {
        if (state.db.settings.disablePin) { state.screen = 'admin'; renderApp(); }
        else {
          const pin = prompt('請輸入家長PIN碼');
          if (pin === state.db.pin) { state.screen = 'admin'; renderApp(); }
          else if (pin !== null) toast('PIN 錯誤');
        }
      }
      if (action === 'goFront') {
        if (state.clockInterval) { clearInterval(state.clockInterval); state.clockInterval = null; }
        state.screen = 'front'; renderApp();
      }
      if (action === 'toggleTheme') { state.db.settings.darkMode = !state.db.settings.darkMode; persist(true, false); }
      if (action === 'setAdminMode') { state.db.settings.adminMode = target.dataset.mode; persist(); }
      if (action === 'selectAdminKid') { state.db.settings.adminKid = target.dataset.kid; persist(true, false); }
      if (action === 'deleteKid') deleteKid(target.dataset.kid);
      
      if (action === 'setSubject') {
        snapshot();
        const subject = state.db.subjects.find(item => item.name === target.dataset.subject);
        if (subject) subject.enabled = target.dataset.enabled === 'true';
        persist(true, false);
      }
      
      if (action === 'submitFlexibleAdd') {
        const subVal = document.getElementById('cfgSubject')?.value || '';
        const folVal = document.getElementById('cfgFolder')?.value || '';
        handleFlexibleAdd(subVal, folVal);
        if (document.getElementById('cfgSubject')) document.getElementById('cfgSubject').value = '';
        if (document.getElementById('cfgFolder')) document.getElementById('cfgFolder').value = '';
      }

      if (action === 'toggleFolder') {
        // 如果是點到刪除按鈕，由另一個 action 處理，不執行縮放
        if(event.target.closest('[data-action="clickDeleteFolder"]')) return;
        const folderName = target.dataset.folder;
        state.expandedFolders[folderName] = !state.expandedFolders[folderName];
        renderApp();
      }

      if (action === 'clickDeleteFolder') {
        event.stopPropagation();
        deleteFolder(target.dataset.folder);
      }

      if (action === 'selectHistoryBook') {
        const subName = target.dataset.subject;
        const pathName = target.dataset.path;
        state.activeHistoryBook = (state.activeHistoryBook && state.activeHistoryBook.subject === subName) ? null : { subject: subName, path: pathName };
        renderApp();
      }

      if (action === 'closeHistoryDrawer') { state.activeHistoryBook = null; renderApp(); }
      if (action === 'deleteSubject') deleteSubject(target.dataset.subject);
      if (action === 'resetWeek') resetThisWeek();
      if (action === 'deleteFixed') deleteFixedTaskRule(target.dataset.id);
      
      if (action === 'editTask') {
        const task = state.db.taskInstances.find(item => item.id === target.dataset.taskId);
        if (task) openTaskModal(task.date, task);
      }
      if (action === 'deleteTask') {
        deleteTask(target.dataset.taskId);
        document.querySelector('[data-modal]')?.remove();
      }
      if (action === 'closeModal') target.closest('[data-modal]')?.remove();
      if (action === 'exportJSON') downloadFile('learning-calendar-backup.json', Repository.exportJSON(), 'application/json;charset=utf-8');
      if (action === 'exportCSV') downloadFile('learning-history.csv', Repository.exportCSV(), 'text/csv;charset=utf-8');
      if (action === 'importJSON' && event.type === 'change') importJSONFile(target.files[0]);
      if (action === 'toggleDisablePin') {
        snapshot();
        state.db.settings.disablePin = !state.db.settings.disablePin;
        persist(true, false);
      }
    }

    function handleSubmit(form, event) {
      event.preventDefault();
      const type = form.dataset.form;
      if (type === 'addKid') addKid(form.kid.value);
      if (type === 'changePin') {
        snapshot(); state.db.pin = form.pin.value.trim(); form.reset(); persist(true, false);
        toast('PIN碼已修改');
      }
      if (type === 'addFixed') addFixedTask(form);
      if (type === 'addTemp') {
        addTempTask({ kid: form.kid.value, subject: form.subject.value, date: form.date.value, memo: form.memo.value });
        form.closest('[data-modal]')?.remove();
      }
      if (type === 'saveTaskEdit') {
        updateTask(form.taskId.value, { kid: form.kid.value, subject: form.subject.value, memo: form.memo.value.trim() });
        form.closest('[data-modal]')?.remove();
      }
    }

    function importJSONFile(file) {
      if (!file) return;
      if (!confirm('將會覆蓋現有資料，確定匯入？')) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          Repository.importJSON(reader.result);
          state.screen = 'front';
          renderApp();
          toast('備份匯入成功！');
        } catch { toast('匯入失敗，格式錯誤'); }
      };
      reader.readAsText(file);
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (target) handleAction(target, event);
    });

    document.addEventListener('submit', event => {
      const form = event.target.closest('form[data-form]');
      if (form) handleSubmit(form, event);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') document.querySelector('[data-modal]')?.remove();
    });

    Repository.initialize();
    renderApp();
  </script>
</body>
</html>
